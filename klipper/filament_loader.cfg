# =====================================================================
# voron0-autoloader - Makros (Logik)
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Diese Datei wird vom Installer als Symlink ins Config-Verzeichnis gelegt
# und NICHT von Hand bearbeitet (Updates ueber den Moonraker Update-Manager).
# Hardware-Pins und alle Parameter stehen in filament_loader_settings.cfg
# (wird vom Installer erzeugt und nie ueberschrieben, editierbar in der
# Web-Oberflaeche).
#
# Meldungen: zweisprachig (variable_lang in _LOADER_VARS = "de" / "en")
# Reihenfolge der Inbetriebnahme: siehe README.md
# =====================================================================


# ---------------------------------------------------------------------
# Laufzeit-Status (fuer Web-Oberflaeche und KlipperScreen)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_STATE]
description: Laufzeitstatus des Loaders (nicht bearbeiten)
variable_state: "idle"       # idle | loading | unloading | testing | error
variable_op: ""              # load_cold | load | unload | bench
variable_result: ""          # "" | ok | error
variable_msg: ""             # letzte Meldung in der eingestellten Sprache
variable_clamped: 0          # 1 = Servo klemmt
variable_event: 0            # Zaehler - jede Aenderung = ein abgeschlossener Vorgang
variable_fed: 0              # mm vom Loader bis Sensor 2 beim letzten Laden/Messen
variable_pos: "unknown"      # none | loader | tube | sensor2 | gears | nozzle | unknown (gesichert)
variable_tip: 0.0            # mm: Filamentspitze ab Loader-Zahnraedern (gesichert)
variable_tip_known: 0        # 1 = tip ist verlaesslich (sonst vorsichtige Suche beim Laden)
variable_sync_msg: ""        # Hinweis des letzten Abgleichs (z. B. Filament im ausgeschalteten Zustand entfernt)
variable_slip: -999.0        # mm: Sensor 2 kam beim letzten Laden so viel spaeter (+) / frueher (-) als erwartet; -999 = nicht gemessen
variable_slip_speed: 0       # mm/s: Foerdertempo dieser Ladung
gcode:


# ---------------------------------------------------------------------
# Position sichern (save_variables) und mit den Sensoren abgleichen
# Die Position ueberlebt Neustarts und Ausschalten. Beim Start vergleicht
# _LOADER_SYNC sie mit den Sensoren und korrigiert sie, wenn Filament im
# ausgeschalteten Zustand entfernt oder eingelegt wurde.
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SAVE]
gcode:
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% if "save_variables" in printer %}
        SAVE_VARIABLE VARIABLE=autoloader_pos VALUE='"{s.pos}"'
        SAVE_VARIABLE VARIABLE=autoloader_tip VALUE={(s.tip|float)|round(1)}
        SAVE_VARIABLE VARIABLE=autoloader_tip_known VALUE={s.tip_known|int}
    {% endif %}

[gcode_macro _LOADER_SET_POS]
description: Position setzen und sichern (POS=, optional TIP=, KNOWN=)
gcode:
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=pos VALUE='"{params.POS}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={params.TIP|default(s.tip)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip_known VALUE={params.KNOWN|default(s.tip_known)|int}
    _LOADER_SAVE

[gcode_macro _LOADER_POS_FROM_TIP]
description: Nach Loader-Fahrten vor Sensor 2 - Position aus der Spitze ableiten (loader / tube)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set has2 = "filament_switch_sensor toolhead_in" in printer %}
    {% if not has2 and s.pos in ["sensor2", "gears", "nozzle"] %}
    {% elif has2 and printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_SET_POS POS={s.pos if s.pos in ["sensor2", "gears", "nozzle"] else "sensor2"}
    {% elif printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_SET_POS POS={"tube" if s.tip|float > v.unload_hold + 5 else "loader"}
    {% else %}
        _LOADER_SET_POS POS=none TIP=0 KNOWN=1
    {% endif %}

[gcode_macro _LOADER_SYNC]
description: Gesicherte Position mit den Sensoren abgleichen (BOOT=1 beim Start)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set de = v.lang != "en" %}
    {% if params.BOOT|default(0)|int == 1 and "save_variables" in printer %}
        {% set sv = printer.save_variables.variables %}
        {% set pos = sv.get("autoloader_pos", "unknown") %}
        {% set tip = sv.get("autoloader_tip", 0)|float %}
        {% set known = sv.get("autoloader_tip_known", 0)|int %}
    {% else %}
        {% set pos = s.pos %}
        {% set tip = s.tip|float %}
        {% set known = s.tip_known|int %}
    {% endif %}
    {% set s1 = printer["filament_switch_sensor loader_in"].filament_detected %}
    {% set has2 = "filament_switch_sensor toolhead_in" in printer %}
    {% set s2 = has2 and printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set beyond = pos in ["sensor2", "gears", "nozzle"] %}
    {% set new = pos %}
    {% set ntip = tip %}
    {% set nknown = known %}
    {% set note = "" %}
    {% if s2 %}
        {% if not beyond %}
            {% set new = "sensor2" %}
            {% set ntip = v.tube_len %}
            {% set nknown = 1 %}
            {% set note = "Filament an Sensor 2 gefunden - ob der Extruder es greift, ist unbekannt" if de else "Filament found at sensor 2 - unknown whether the extruder grips it" %}
        {% endif %}
    {% elif beyond and has2 %}
        {% if s1 %}
            {% set new = "tube" %}
            {% set nknown = 0 %}
        {% else %}
            {% set new = "none" %}
            {% set ntip = 0 %}
            {% set nknown = 1 %}
        {% endif %}
        {% set note = "Filament ist nicht mehr im Toolhead - wurde es entfernt oder zurueckgezogen?" if de else "Filament is no longer in the toolhead - was it removed or pulled back?" %}
    {% elif s1 %}
        {% if pos == "none" %}
            {% set new = "loader" %}
            {% set ntip = 0 %}
            {% set nknown = 1 if v.auto_enable|default(1)|int == 1 else 0 %}
        {% elif pos not in ["loader", "tube"] and not beyond %}
            {% set new = "loader" %}
            {% set nknown = 0 %}
        {% endif %}
    {% elif pos != "none" %}
        {% set new = "none" %}
        {% set ntip = 0 %}
        {% set nknown = 1 %}
        {% if pos != "unknown" %}
            {% set note = "Filament wurde entfernt" if de else "Filament was removed" %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=pos VALUE='"{new}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={ntip}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip_known VALUE={nknown}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=sync_msg VALUE='"{note}"'
    {% if new != pos or ntip != tip or nknown != known or params.BOOT|default(0)|int == 1 %}
        _LOADER_SAVE
    {% endif %}
    {% if note %}
        RESPOND TYPE=error MSG="AutoLoader: {note}"
    {% endif %}

[delayed_gcode _LOADER_BOOT]
initial_duration: 2
gcode:
    _LOADER_SYNC BOOT=1

[gcode_macro LOADER_SYNC]
description: Filament-Position mit den Sensoren abgleichen
gcode:
    _LOADER_SYNC

[gcode_macro LOADER_SET_POS]
description: Filament-Position von Hand setzen - POS=none|loader|tube|sensor2|gears|nozzle (optional TIP= mm ab Loader-Zahnraedern)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set p = params.POS|default("unknown")|lower %}
    {% set d = {"none": 0, "loader": v.unload_hold, "tube": v.tube_len - v.park_dist|default(20),
                "sensor2": v.tube_len, "gears": v.tube_len + v.gear_offset + v.gear_push,
                "nozzle": v.tube_len + v.gear_offset + v.ext_to_nozzle} %}
    {% if p not in d %}
        _LOADER_SAY TYPE=error DE="LOADER_SET_POS - POS muss none, loader, tube, sensor2, gears oder nozzle sein" EN="LOADER_SET_POS - POS must be none, loader, tube, sensor2, gears or nozzle"
    {% else %}
        _LOADER_SET_POS POS={p} TIP={params.TIP|default(d[p])|float} KNOWN=1
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=sync_msg VALUE='""'
        _LOADER_SAY DE="Filament-Position gesetzt - {p}" EN="Filament position set - {p}"
    {% endif %}


# ---------------------------------------------------------------------
# Meldungen
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SAY]
description: Meldung ausgeben (DE=, EN=, optional TYPE=error)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    RESPOND TYPE={params.TYPE|default("echo")} MSG="{m}"

[gcode_macro _LOADER_BEGIN]
description: Vorgang beginnen (OP=, STATE=)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=op VALUE='"{params.OP}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"{params.STATE}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=result VALUE='""'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=msg VALUE='""'

[gcode_macro _LOADER_END]
description: Vorgang beenden (RESULT=ok/error, DE=, EN=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"{"idle" if params.RESULT == "ok" else "error"}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=result VALUE='"{params.RESULT}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=msg VALUE='"{m}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=event VALUE={s.event + 1}


# ---------------------------------------------------------------------
# Servo / Stepper Grundfunktionen
# ---------------------------------------------------------------------
[gcode_macro LOADER_CLAMP]
description: Servo drueckt den Hebel -> BMG-Zahnraeder greifen (optional ANGLE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set a = params.ANGLE|default(v.servo_clamp)|float %}
    SET_SERVO SERVO=loader_clamp ANGLE={a}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=clamped VALUE=1
    G4 P{(v.servo_settle * 1000)|int}

[gcode_macro LOADER_RELEASE]
description: Hebel frei -> Filament laeuft frei (optional ANGLE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set a = params.ANGLE|default(v.servo_release)|float %}
    SET_SERVO SERVO=loader_clamp ANGLE={a}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=clamped VALUE=0
    G4 P{(v.servo_settle * 1000)|int}
    {% if v.servo_off_released|int == 1 %}
        SET_SERVO SERVO=loader_clamp WIDTH=0
    {% endif %}

[gcode_macro _LOADER_MOVE_REL]
description: Interner relativer Stepper-Move (DIST in mm, SPEED in mm/s)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set spd = params.SPEED|default(v.speed)|float %}
    MANUAL_STEPPER STEPPER=loader ENABLE=1 SET_POSITION=0 MOVE={params.DIST|float} SPEED={spd}
    M400
    {% if s.clamped|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={s.tip|float + params.DIST|float}
    {% endif %}

[gcode_macro _LOADER_E]
description: Extruder-Move (relativ, M83 vorher setzen) in Stuecken unter max_extrude_only_distance (Standard 50 mm)
gcode:
    {% set d = params.DIST|float %}
    {% set n = ((d|abs) / 40)|round(0, 'ceil')|int %}
    {% for i in range(n) %}
        G1 E{d / n} F{params.F|int}
    {% endfor %}

[gcode_macro LOADER_MOVE]
description: Test: DIST=mm (negativ=zurueck) SPEED=mm/s CLAMP=1/0
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set clamp = params.CLAMP|default(1)|int %}
    {% if clamp == 1 %}
        LOADER_CLAMP
    {% endif %}
    _LOADER_MOVE_REL DIST={params.DIST|default(100)|float} SPEED={params.SPEED|default(v.speed)|float}
    {% if clamp == 1 %}
        LOADER_RELEASE
    {% endif %}
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    {% if clamp == 1 and printer["gcode_macro _LOADER_STATE"].pos in ["none", "loader", "tube", "unknown"] %}
        _LOADER_POS_FROM_TIP
    {% endif %}

[gcode_macro LOADER_STOP]
description: Servo loesen und Stepper stromlos schalten
gcode:
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0

[gcode_macro LOADER_AUTO]
description: Auto-Laden ein/aus (ENABLE=1/0, bis zum Neustart; dauerhaft: auto_enable in den Einstellungen)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_VARS VARIABLE=auto_enable VALUE={params.ENABLE|default(1)|int}

[gcode_macro _LOADER_HEATER_OFF]
description: Duese ausschalten nach Laden/Entladen (heater_off), nie waehrend eines Drucks oder einer Pause
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% if v.heater_off|default(1)|int == 1 and params.PRINT|default(0)|int == 0 and printer.print_stats.state not in ["printing", "paused"] %}
        M104 S0
    {% endif %}

[gcode_macro LOADER_BENCH]
description: Bench-Modus ein/aus (VALUE=1/0, bis zum Neustart; dauerhaft in den Einstellungen)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_VARS VARIABLE=bench_mode VALUE={params.VALUE|default(1)|int}

[gcode_macro LOADER_STATUS]
description: Sensor- und Loader-Status anzeigen
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set de = v.lang != "en" %}
    {% set a = ("Filament" if de else "filament") if printer["filament_switch_sensor loader_in"].filament_detected else ("leer" if de else "empty") %}
    {% if "filament_switch_sensor toolhead_in" in printer %}
        {% set b = ("Filament" if de else "filament") if printer["filament_switch_sensor toolhead_in"].filament_detected else ("leer" if de else "empty") %}
    {% else %}
        {% set b = "nicht konfiguriert" if de else "not configured" %}
    {% endif %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set sl = s.slip|default(-999)|float %}
    {% set slt = ("" if sl <= -900 else (" / Abweichung letzte Ladung: " if de else " / deviation on the last load: ") ~ ("+" if sl > 0 else "") ~ (sl|round(1)) ~ " mm @ " ~ (s.slip_speed|int) ~ " mm/s") %}
    {% if de %}
        RESPOND MSG="Loader-Eingang: {a} / Toolhead-Eingang: {b} / Position: {s.pos} ({s.tip|float|round(0)|int} mm{'' if s.tip_known|int == 1 else ', ungenau'}) / Bench-Modus: {'an' if v.bench_mode|int == 1 else 'aus'}{slt}"
    {% else %}
        RESPOND MSG="Loader entrance: {a} / toolhead entrance: {b} / position: {s.pos} ({s.tip|float|round(0)|int} mm{'' if s.tip_known|int == 1 else ', approximate'}) / bench mode: {'on' if v.bench_mode|int == 1 else 'off'}{slt}"
    {% endif %}

[gcode_macro LOADER_BENCHTEST]
description: Bench-Test - Servo klemmt, Stepper faehrt DIST mm, Servo loest (braucht nur Sensor 1)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set dist = params.DIST|default(v.bench_dist)|float %}
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=bench STATE=testing
    {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_FAIL DE="Benchtest - kein Filament an Sensor 1" EN="Bench test - no filament at sensor 1"
    {% else %}
        {% if printer["gcode_macro _LOADER_STATE"].pos == "none" %}
            _LOADER_SET_POS POS=loader TIP=0 KNOWN=1
        {% endif %}
        LOADER_CLAMP
        _LOADER_MOVE_REL DIST={dist} SPEED={v.slow_speed}
        LOADER_RELEASE
        MANUAL_STEPPER STEPPER=loader ENABLE=0
        _LOADER_POS_FROM_TIP
        _LOADER_END RESULT=ok DE="Benchtest fertig" EN="Bench test done"
        _LOADER_SAY DE="Benchtest fertig" EN="Bench test done"
    {% endif %}


# ---------------------------------------------------------------------
# Fehlerbehandlung
# (action_raise_error wird beim Rendern ausgefuehrt -> darum eigenes Macro,
#  damit Servo-Loesen und Meldung vorher laufen)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_RAISE]
gcode:
    {action_raise_error("AutoLoader: " ~ params.MSG)}

[gcode_macro _LOADER_FAIL]
description: Servo loesen, Stepper aus, Fehlermeldung, Abbruch (DE=, EN=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    {% set op = printer["gcode_macro _LOADER_STATE"].op %}
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    {% if op in ["load", "unload", "park"] %}
        _LOADER_HEATER_OFF
    {% endif %}
    _LOADER_POS_FROM_TIP
    _LOADER_END RESULT=error DE="{params.DE}" EN="{params.EN}"
    RESPOND TYPE=error MSG="AutoLoader: {m}"
    _LOADER_RAISE MSG="{m}"

[gcode_macro _LOADER_CHECK_IDLE]
description: Abbruch waehrend eines Drucks (ALLOW=1 nur fuer die PRINT_START/PRINT_END-Hooks)
gcode:
    {% if printer.print_stats.state == "printing" and params.ALLOW|default(0)|int == 0 %}
        _LOADER_FAIL DE="Nicht waehrend eines Drucks moeglich" EN="Not possible while printing"
    {% endif %}

[gcode_macro _LOADER_RUNOUT]
description: runout_gcode von Sensor 1
gcode:
    _LOADER_SAY TYPE=error DE="AutoLoader - Filament am Loader-Eingang fehlt" EN="AutoLoader - filament missing at the loader entrance"


# ---------------------------------------------------------------------
# Sensorsuche
# Klipper verbietet, dass ein Makro sich selbst aufruft. Darum rendert
# _LOADER_SEARCH viele Aufrufe von _LOADER_SEARCH_STEP NACHEINANDER (nicht
# verschachtelt). Jeder Schritt wird erst bei seiner Ausfuehrung gerendert und
# liest den Sensor deshalb frisch; nach dem Treffer tun die restlichen nichts.
#   MODE=load   foerdern, bis Sensor 2 Filament meldet
#   MODE=unload zurueckziehen, bis Sensor 2 frei ist
#   WIN=  mm Suchfenster, BASE= mm schon gefahren (fuer "fed"), MEASURE=1 Messfahrt
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SEARCH_STATE]
variable_mode: "load"
variable_done: 0             # 0 = sucht, 1 = gefunden, 2 = Fenster ausgeschoepft
variable_moved: 0.0
variable_steps: 0
variable_base: 0.0
variable_measure: 0
variable_step: 2.0
variable_speed: 10.0
variable_expect: -1.0        # erwartete Spitzenposition an Sensor 2 (tube_len), -1 = keine Schlupfmessung
gcode:

[gcode_macro _LOADER_SEARCH]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set win = params.WIN|float %}
    {% set step = params.STEP|default(v.step_mm)|float %}
    {% set n = (win / step)|round(0, 'ceil')|int %}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=step VALUE={step}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=speed VALUE={params.SPEED|default(v.slow_speed)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=mode VALUE='"{params.MODE|default("load")}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=moved VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=steps VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=base VALUE={params.BASE|default(0)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=measure VALUE={params.MEASURE|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=expect VALUE={params.EXPECT|default(-1)|float}
    {% for i in range(n + 1) %}
        _LOADER_SEARCH_STEP WIN={win}
    {% endfor %}
    _LOADER_SEARCH_DONE

[gcode_macro _LOADER_SEARCH_STEP]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    {% set th = printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set load = s.mode == "load" %}
    {% set win = params.WIN|float %}
    {% if s.done == 0 %}
        {% if (load and th) or (not load and not th) %}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=1
        {% elif s.moved >= win %}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=2
        {% elif load and not printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_FAIL DE="Filament am Loader-Eingang verschwunden" EN="Filament vanished at the loader entrance"
        {% else %}
            {% set d = [s.step, win - s.moved]|min %}
            _LOADER_MOVE_REL DIST={d if load else -d} SPEED={s.speed}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=moved VALUE={s.moved + d}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=steps VALUE={s.steps + 1}
        {% endif %}
    {% endif %}

[gcode_macro _LOADER_SEARCH_DONE]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    {% set fed = s.base + s.moved %}
    {% if s.done == 1 %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={fed if s.measure == 1 else v.tube_len}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip_known VALUE=1
    {% endif %}
    {% if s.done != 1 %}
        {% if s.mode == "load" %}
            _LOADER_FAIL DE="Timeout - Filament hat Sensor 2 nicht erreicht (nach {fed|round(1)} mm)" EN="Timeout - filament did not reach sensor 2 (after {fed|round(1)} mm)"
        {% else %}
            _LOADER_FAIL DE="Timeout - Sensor 2 wird nicht frei" EN="Timeout - sensor 2 does not clear"
        {% endif %}
    {% elif s.mode == "load" %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=fed VALUE={fed}
        {% if s.base > 0 and s.steps == 0 %}
            {% if s.measure == 1 %}
                _LOADER_SAY TYPE=error DE="Achtung - Sensor 2 schon waehrend der vollen Fahrt erreicht, Messwert zu gross. tube_len kleiner einstellen und wiederholen" EN="Warning - sensor 2 was already reached during the full-speed move, the value is too large. Reduce tube_len and repeat"
            {% else %}
                _LOADER_FAIL DE="Sensor 2 schon waehrend der vollen Fahrt erreicht - tube_len ist zu gross oder approach zu klein. Filament zurueckziehen und tube_len messen" EN="Sensor 2 was already reached during the full-speed move - tube_len is too large or approach too small. Pull the filament back and measure tube_len"
            {% endif %}
        {% endif %}
        {% if s.expect >= 0 and s.measure == 0 %}
            {% set dev = (fed - s.expect)|round(1) %}
            {% set sg = "+" if dev > 0 else "" %}
            {% set warn = v.slip_warn|default(10)|float %}
            SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=slip VALUE={dev}
            SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=slip_speed VALUE={v.speed}
            _LOADER_SAY DE="Loader - Sensor 2 nach {fed|round(1)} mm erreicht (Abweichung {sg}{dev} mm)" EN="Loader - sensor 2 reached after {fed|round(1)} mm (deviation {sg}{dev} mm)"
            {% if dev > warn %}
                _LOADER_SAY TYPE=error DE="Achtung - Sensor 2 kam {dev} mm spaeter als erwartet: Schlupf oder Schrittverlust bei {v.speed} mm/s. Beschleunigung (accel) oder Tempo senken, Klemmwinkel pruefen. Ist die Abweichung bei jedem Tempo gleich, tube_len neu messen" EN="Warning - sensor 2 came {dev} mm later than expected: slip or lost steps at {v.speed} mm/s. Lower the acceleration (accel) or the speed, check the clamp angle. If the deviation is the same at every speed, measure tube_len again"
            {% elif dev < -warn %}
                _LOADER_SAY TYPE=error DE="Achtung - Sensor 2 kam {dev|abs} mm frueher als erwartet - tube_len ist zu gross, bitte neu messen" EN="Warning - sensor 2 came {dev|abs} mm earlier than expected - tube_len is too large, please measure it again"
            {% endif %}
        {% else %}
            _LOADER_SAY DE="Loader - Sensor 2 nach {fed|round(1)} mm erreicht" EN="Loader - sensor 2 reached after {fed|round(1)} mm"
        {% endif %}
    {% else %}
        _LOADER_SAY DE="Loader - Sensor 2 frei" EN="Loader - sensor 2 clear"
    {% endif %}


# ---------------------------------------------------------------------
# Laden: volle Fahrt (speed) bis "approach" mm vor Sensor 2, dann Sensorsuche
# ---------------------------------------------------------------------
[gcode_macro _LOADER_NEED_TOOLHEAD_SENSOR]
gcode:
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_FAIL DE="Sensor 2 (toolhead_in) ist nicht konfiguriert - in den Einstellungen aktivieren" EN="Sensor 2 (toolhead_in) is not configured - enable it in the settings"
    {% endif %}

[gcode_macro _LOADER_LOAD_TO_GEARS]
description: Loader foerdert Filament bis in die Extruder-Zahnraeder, dann Servo frei
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_FAIL DE="Kein Filament am Loader-Eingang" EN="No filament at the loader entrance"
    {% endif %}
    {% if printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_FAIL DE="Toolhead-Sensor meldet bereits Filament - erst entladen" EN="Toolhead sensor already reports filament - unload first"
    {% endif %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set approach = v.approach|default(30)|float %}
    {% set fresh = s.pos == "none" %}
    {% set tip = 0 if fresh else s.tip|float %}
    {% set known = fresh or s.tip_known|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=slip VALUE=-999
    {% if fresh %}
        _LOADER_SET_POS POS=loader TIP=0 KNOWN=1
    {% endif %}
    LOADER_CLAMP
    {% if known %}
        {% set coarse = [v.tube_len - approach - tip, 0]|max %}
        {% if coarse > 0 %}
            _LOADER_MOVE_REL DIST={coarse} SPEED={v.speed}
        {% endif %}
        _LOADER_SEARCH MODE=load WIN={approach + v.overrun} BASE={tip + coarse} EXPECT={v.tube_len}
    {% else %}
        _LOADER_SAY DE="Loader - Position im Schlauch unbekannt, suche Sensor 2 vorsichtig" EN="Loader - position in the tube unknown, searching sensor 2 carefully"
        _LOADER_SEARCH MODE=load WIN={v.tube_len + v.overrun} STEP={[v.step_mm, 5]|max} SPEED={[v.speed, 60]|min}
    {% endif %}
    _LOADER_HANDOVER CLAMP=0

[gcode_macro _LOADER_HANDOVER]
description: Spitze von Sensor 2 in die Extruder-Zahnraeder schieben, kalt greifen (grip_len), Servo frei
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% if params.CLAMP|default(1)|int == 1 %}
        LOADER_CLAMP
    {% endif %}
    _LOADER_MOVE_REL DIST={v.gear_offset + v.gear_push} SPEED={v.slow_speed}
    _LOADER_GRIP
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    _LOADER_SET_POS POS=gears

[gcode_macro _LOADER_GRIP]
description: Extruder greift das Filament auch kalt - Loader und Extruder fahren gleichzeitig grip_len mm (FORCE_MOVE)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set g = v.grip_len|default(0)|float %}
    {% set sp = v.grip_speed|default(5)|float %}
    {% set fm = printer.configfile.settings["force_move"]|default({}) %}
    {% if g > 0 %}
        {% if fm.enable_force_move|default(false) %}
            M400
            MANUAL_STEPPER STEPPER=loader ENABLE=1 SET_POSITION=0 MOVE={g} SPEED={sp} ACCEL=200 SYNC=0
            FORCE_MOVE STEPPER=extruder DISTANCE={g} VELOCITY={sp} ACCEL=200
            M400
            SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={s.tip|float + g}
        {% else %}
            _LOADER_SAY DE="Loader - Kalt greifen uebersprungen: [force_move] enable_force_move: True fehlt (./install.sh ergaenzt es)" EN="Loader - cold grip skipped: [force_move] enable_force_move: True is missing (./install.sh adds it)"
        {% endif %}
    {% endif %}

[gcode_macro _LOADER_TO_NOZZLE]
description: Extruder foerdert bis zur Duese - abzueglich dessen, was beim kalten Greifen schon gefoerdert wurde
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set base = v.tube_len + v.gear_offset + v.gear_push %}
    {% set done = [[s.tip|float - base, 0]|max, 30, v.ext_to_nozzle]|min if s.pos == "gears" and s.tip_known|int == 1 else 0 %}
    _LOADER_E DIST={v.ext_to_nozzle - done} F={(v.ext_speed * 60)|int}

[gcode_macro FILAMENT_LOAD_COLD]
description: Filament bis in die Extruder-Zahnraeder foerdern (Hotend darf kalt sein)
gcode:
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=load_cold STATE=loading
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% if "filament_switch_sensor toolhead_in" in printer and printer["filament_switch_sensor toolhead_in"].filament_detected %}
        {% if printer["gcode_macro _LOADER_STATE"].pos not in ["gears", "nozzle"] %}
            _LOADER_HANDOVER
        {% endif %}
    {% else %}
        _LOADER_LOAD_TO_GEARS
    {% endif %}
    _LOADER_END RESULT=ok DE="Filament sitzt im Extruder" EN="Filament is seated in the extruder"
    _LOADER_SAY DE="Loader - Filament sitzt im Extruder. Weiter mit FILAMENT_LOAD TEMP=xxx" EN="Loader - filament is seated in the extruder. Continue with FILAMENT_LOAD TEMP=xxx"

[gcode_macro FILAMENT_LOAD]
description: Filament laden und bis in die Duese foerdern (TEMP=, PURGE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set temp = params.TEMP|default(v.default_temp)|float %}
    {% set purge = params.PURGE|default(v.purge_len)|float %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=load STATE=loading
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_NEED_TOOLHEAD_SENSOR
    {% else %}
        {% set pos = printer["gcode_macro _LOADER_STATE"].pos %}
        M104 S{temp}
        {% if not printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_LOAD_TO_GEARS
        {% elif pos not in ["gears", "nozzle"] %}
            _LOADER_HANDOVER
        {% endif %}
        M109 S{temp}
        SAVE_GCODE_STATE NAME=_LOADER
        M83
        {% if pos != "nozzle" or not printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_TO_NOZZLE
        {% endif %}
        {% if purge > 0 %}
            _LOADER_E DIST={purge} F={(v.purge_speed * 60)|int}
        {% endif %}
        M400
        RESTORE_GCODE_STATE NAME=_LOADER
        _LOADER_SET_POS POS=nozzle TIP={v.tube_len + v.gear_offset + v.ext_to_nozzle} KNOWN=1
        _LOADER_HEATER_OFF PRINT={params.PRINT|default(0)|int}
        _LOADER_END RESULT=ok DE="Filament geladen" EN="Filament loaded"
        _LOADER_SAY DE="Loader - Filament geladen" EN="Loader - filament loaded"
    {% endif %}

[gcode_macro FILAMENT_LOADER_AUTO]
description: Wird von Sensor 1 ausgeloest (insert_gcode) - auto_enable, auto_target (cold/hot), bench_mode
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% if v.auto_enable|default(1)|int == 1 %}
        G4 P{(v.auto_delay * 1000)|int}
        {% if v.bench_mode|int == 1 %}
            LOADER_BENCHTEST
        {% elif v.auto_target|default("cold") == "hot" %}
            FILAMENT_LOAD TEMP={tgt if tgt > 0 else v.default_temp}
        {% else %}
            FILAMENT_LOAD_COLD
        {% endif %}
    {% endif %}


# ---------------------------------------------------------------------
# Tip-Forming (Ablauf wie ERCF / Happy Hare / PrusaSlicer-Wipe-Tower)
# 1. optional rammen (tip_ram_len)
# 2. schnell aus der Schmelzzone reissen, dann langsamer bis in die
#    Kuehlzone (tip_cool_pos mm oberhalb der Duese)
# 3. optional Temperatur senken (tip_temp, ohne Warten)
# 4. tip_cool_moves Kuehlbewegungen um tip_cool_len, Tempo steigt von
#    tip_cool_start auf tip_cool_end -> duenne, feste Spitze ohne Faden
# Danach steht die Spitze ca. tip_cool_pos mm ueber der Duese.
# ---------------------------------------------------------------------
[gcode_macro _LOADER_FORM_TIP]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set ram = v.tip_ram_len|default(0)|float %}
    {% set ttemp = v.tip_temp|default(0)|float %}
    {% set s0 = v.tip_speed_start|default(80)|float %}
    {% set s1 = v.tip_speed|default(18)|float %}
    {% set pos = v.tip_cool_pos|default(35)|float %}
    {% set clen = v.tip_cool_len|default(10)|float %}
    {% set moves = v.tip_cool_moves|default(4)|int %}
    {% set c0 = v.tip_cool_start|default(10)|float %}
    {% set c1 = v.tip_cool_end|default(50)|float %}
    {% set first = [15, pos]|min %}
    {% set rest = pos - first %}
    {% set inc = (c1 - c0) / ([2 * moves - 1, 1]|max) %}
    SAVE_GCODE_STATE NAME=_LOADER_TIP
    M83
    {% if ram > 0 %}
        G1 E{ram} F{(v.ext_speed * 60)|int}
    {% endif %}
    G1 E-{first} F{(s0 * 60)|int}
    {% if rest > 0 %}
        G1 E-{rest * 0.7} F{(s1 * 60)|int}
        G1 E-{rest * 0.2} F{(s1 * 30)|int}
        G1 E-{rest * 0.1} F{(s1 * 18)|int}
    {% endif %}
    {% if ttemp > 0 %}
        M104 S{ttemp}
    {% endif %}
    {% for i in range(moves) %}
        {% set sp = c0 + inc * i * 2 %}
        G1 E{clen} F{(sp * 60)|int}
        G1 E-{clen} F{((sp + inc) * 60)|int}
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=_LOADER_TIP

[gcode_macro LOADER_FORM_TIP]
description: Nur Spitze formen (TEMP=), Filament bleibt im Extruder - zum Einstellen der Tip-Parameter
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    _LOADER_CHECK_IDLE
    M109 S{temp}
    _LOADER_FORM_TIP
    _LOADER_SAY DE="Spitze geformt - mit FILAMENT_UNLOAD entladen oder von Hand ziehen und pruefen" EN="Tip formed - unload with FILAMENT_UNLOAD or pull by hand and inspect"


# ---------------------------------------------------------------------
# Entladen und Parken
# 1. Spitze formen (tip_enable), Servo ist dabei frei
# 2. Extruder zieht bis unload_ext_len (gesamt ab Duese) zurueck
# 3. Loader klemmt, Extruder-Stepper wird stromlos, Loader zieht, bis Sensor 2 frei ist
# 4. Entladen: weiter bis unload_hold mm im Loader bleiben
#    Parken:   nur park_dist mm hinter Sensor 2 (Filament bleibt im Schlauch,
#              naechstes Laden geht dann sehr schnell)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_OUT_OF_TOOLHEAD]
description: Spitze formen, Extruder zurueck, Loader zieht bis Sensor 2 frei (TEMP=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tip = v.tip_enable|default(1)|int == 1 %}
    {% set done = v.tip_cool_pos|default(35)|float if tip else 0 %}
    {% set eject = v.tip_eject_speed|default(25)|float if tip else v.ext_speed %}
    LOADER_RELEASE
    M109 S{params.TEMP|float}
    {% if tip %}
        _LOADER_FORM_TIP
    {% endif %}
    SAVE_GCODE_STATE NAME=_LOADER
    M83
    {% if v.unload_ext_len > done %}
        _LOADER_E DIST=-{v.unload_ext_len - done} F={(eject * 60)|int}
    {% endif %}
    M400
    RESTORE_GCODE_STATE NAME=_LOADER
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={v.tube_len + [v.gear_offset + v.ext_to_nozzle - v.unload_ext_len, 0]|max}
    LOADER_CLAMP
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    _LOADER_SEARCH MODE=unload WIN={[v.gear_offset + v.ext_to_nozzle - v.unload_ext_len, 0]|max + 30}

[gcode_macro _LOADER_BACK_TO]
description: Filament vor Sensor 2 auf TIP= mm ab Loader-Zahnraedern zurueckziehen (Servo klemmt dabei)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set d = s.tip|float - params.TIP|float %}
    {% if d > 0.5 %}
        {% if s.clamped|int == 0 %}
            LOADER_CLAMP
        {% endif %}
        _LOADER_MOVE_REL DIST=-{d} SPEED={v.speed}
    {% endif %}
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0

[gcode_macro FILAMENT_UNLOAD]
description: Filament entladen mit Tip-Forming (TEMP=) - bis auf unload_hold mm in den Loader
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set temp = params.TEMP|default(v.default_temp)|float %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=unload STATE=unloading
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_NEED_TOOLHEAD_SENSOR
    {% elif printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_OUT_OF_TOOLHEAD TEMP={temp}
        _LOADER_BACK_TO TIP={v.unload_hold}
        _LOADER_SET_POS POS=loader TIP={v.unload_hold} KNOWN=1
        _LOADER_HEATER_OFF PRINT={params.PRINT|default(0)|int}
        _LOADER_END RESULT=ok DE="Entladen fertig" EN="Unload done"
        _LOADER_SAY DE="Loader - Entladen fertig, Filament kann von Hand entnommen werden" EN="Loader - unload done, the filament can be removed by hand"
    {% elif s.pos == "tube" and s.tip_known|int == 1 and printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_BACK_TO TIP={v.unload_hold}
        _LOADER_SET_POS POS=loader TIP={v.unload_hold} KNOWN=1
        _LOADER_END RESULT=ok DE="Aus dem Schlauch zurueckgezogen" EN="Pulled back out of the tube"
        _LOADER_SAY DE="Loader - Filament aus dem Schlauch zurueckgezogen" EN="Loader - filament pulled back out of the tube"
    {% else %}
        _LOADER_END RESULT=ok DE="Kein Filament im Toolhead - nichts zu entladen" EN="No filament in the toolhead - nothing to unload"
        _LOADER_SAY DE="Loader - kein Filament im Toolhead, nichts zu entladen" EN="Loader - no filament in the toolhead, nothing to unload"
    {% endif %}

[gcode_macro FILAMENT_PARK]
description: Filament mit Tip-Forming bis park_dist mm hinter Sensor 2 in den Schlauch zurueckziehen (TEMP=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set temp = params.TEMP|default(v.default_temp)|float %}
    {% set park = v.tube_len - v.park_dist|default(20) %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=park STATE=unloading
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_NEED_TOOLHEAD_SENSOR
    {% elif printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_OUT_OF_TOOLHEAD TEMP={temp}
        _LOADER_BACK_TO TIP={park}
        _LOADER_SET_POS POS=tube TIP={park} KNOWN=1
        _LOADER_HEATER_OFF PRINT={params.PRINT|default(0)|int}
        _LOADER_END RESULT=ok DE="Geparkt im Schlauch" EN="Parked in the tube"
        _LOADER_SAY DE="Loader - Filament im Schlauch geparkt" EN="Loader - filament parked in the tube"
    {% else %}
        _LOADER_END RESULT=ok DE="Kein Filament im Toolhead - nichts zu parken" EN="No filament in the toolhead - nothing to park"
        _LOADER_SAY DE="Loader - kein Filament im Toolhead, nichts zu parken" EN="Loader - no filament in the toolhead, nothing to park"
    {% endif %}


# ---------------------------------------------------------------------
# Mainsail / KlipperScreen: deren Lade-Buttons rufen LOAD_FILAMENT und
# UNLOAD_FILAMENT auf. Temperatur: TEMP=, sonst aktuelles Ziel, sonst default_temp.
# ---------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Filament laden (AutoLoader) - TEMP=, PURGE=
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set purge = params.PURGE|default(v.purge_len)|float %}
    FILAMENT_LOAD TEMP={temp} PURGE={purge}

[gcode_macro UNLOAD_FILAMENT]
description: Filament entladen mit Tip-Forming (AutoLoader) - TEMP=
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    FILAMENT_UNLOAD TEMP={temp}


# ---------------------------------------------------------------------
# Druck-Hooks (vom Installer in PRINT_START / PRINT_END eingefuegt)
# ---------------------------------------------------------------------
[gcode_macro LOADER_PRINT_START]
description: In PRINT_START nach dem Aufheizen der Duese - prueft Sensor 2, laedt bei Bedarf (print_start_mode)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set mode = v.print_start_mode|default(2)|int %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set has_tool = "filament_switch_sensor toolhead_in" in printer %}
    {% if mode > 0 and has_tool and not printer["filament_switch_sensor toolhead_in"].filament_detected %}
        {% if mode == 2 and printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_SAY DE="Druckstart - kein Filament im Toolhead, AutoLoader laedt" EN="Print start - no filament in the toolhead, AutoLoader is loading"
            FILAMENT_LOAD TEMP={temp} PURGE=0 PRINT=1
        {% else %}
            _LOADER_FAIL DE="Druckstart abgebrochen - kein Filament im Toolhead" EN="Print start aborted - no filament in the toolhead"
        {% endif %}
    {% endif %}

[gcode_macro LOADER_PRINT_END]
description: In PRINT_END vor TURN_OFF_HEATERS - print_end_action 0 nichts, 1 parken, 2 entladen
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set act = v.print_end_action|default(2 if v.unload_after_print|default(0)|int == 1 else 0)|int %}
    {% if act > 0 and "filament_switch_sensor toolhead_in" in printer %}
        {% if printer["filament_switch_sensor toolhead_in"].filament_detected %}
            {% if act == 1 %}
                FILAMENT_PARK TEMP={tgt if tgt > 0 else v.default_temp} PRINT=1
            {% else %}
                FILAMENT_UNLOAD TEMP={tgt if tgt > 0 else v.default_temp} PRINT=1
            {% endif %}
        {% endif %}
    {% endif %}


# ---------------------------------------------------------------------
# Messhelfer (Web-Oberflaeche: Stepper kalibrieren -> Laengen messen)
# ---------------------------------------------------------------------
[gcode_macro LOADER_TO_SENSOR]
description: Messen - foerdert bis Sensor 2 und stoppt dort (Weg -> tube_len). COARSE= mm volle Fahrt, MAX= mm hoechstens, HOLD=1 bleibt geklemmt
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set approach = v.approach|default(30)|float %}
    {% set coarse = params.COARSE|default([v.tube_len - approach - 30, 0]|max)|float %}
    {% set maxlen = params.MAX|default(v.tube_len + v.overrun + 40)|float %}
    {% set window = [maxlen - coarse, 2 * v.step_mm]|max %}
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=measure STATE=loading
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% if "filament_switch_sensor toolhead_in" in printer %}
        {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_FAIL DE="Kein Filament am Loader-Eingang" EN="No filament at the loader entrance"
        {% elif printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_FAIL DE="Sensor 2 meldet bereits Filament - erst zurueckziehen" EN="Sensor 2 already reports filament - pull back first"
        {% else %}
            _LOADER_SET_POS POS=loader TIP=0 KNOWN=1
            LOADER_CLAMP
            {% if coarse > 0 %}
                _LOADER_MOVE_REL DIST={coarse} SPEED={v.speed}
            {% endif %}
            _LOADER_SEARCH MODE=load WIN={window} BASE={coarse} MEASURE=1
            {% if params.HOLD|default(0)|int == 0 %}
                LOADER_RELEASE
                MANUAL_STEPPER STEPPER=loader ENABLE=0
            {% endif %}
            _LOADER_SET_POS POS=sensor2
            _LOADER_END RESULT=ok DE="Sensor 2 erreicht" EN="Sensor 2 reached"
        {% endif %}
    {% endif %}

[gcode_macro LOADER_NUDGE]
description: Messen - schiebt DIST mm nach, Servo bleibt geklemmt und Stepper bestromt (Ende mit LOADER_STOP)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    _LOADER_CHECK_IDLE
    {% if printer["gcode_macro _LOADER_STATE"].clamped|int == 0 %}
        LOADER_CLAMP
    {% endif %}
    _LOADER_MOVE_REL DIST={params.DIST|default(1)|float} SPEED={params.SPEED|default(v.slow_speed)|float}

[gcode_macro LOADER_EXTRUDE]
description: Messen - Extruder foerdert DIST mm (heizt auf TEMP=, ohne TEMP auf das aktuelle Ziel)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    _LOADER_CHECK_IDLE
    {% if printer["gcode_macro _LOADER_STATE"].clamped|int == 1 %}
        LOADER_STOP
    {% endif %}
    M109 S{temp}
    SAVE_GCODE_STATE NAME=_LOADER
    M83
    _LOADER_E DIST={params.DIST|default(5)|float} F={(params.SPEED|default(v.ext_speed)|float * 60)|int}
    M400
    RESTORE_GCODE_STATE NAME=_LOADER
