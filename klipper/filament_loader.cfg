# =====================================================================
# voron0-autoloader - Makros (Logik)
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Diese Datei wird vom Installer als Symlink ins Config-Verzeichnis gelegt
# und NICHT von Hand bearbeitet (Updates ueber den Moonraker Update-Manager).
# Hardware-Pins und alle Parameter stehen in filament_loader_settings.cfg
# (wird vom Installer erzeugt und nie ueberschrieben, editierbar in der
# Web-Oberflaeche).
#
# Meldungen: zweisprachig (variable_lang in _LOADER_VARS = "de" / "en")
# Reihenfolge der Inbetriebnahme: siehe README.md
# =====================================================================


# ---------------------------------------------------------------------
# Laufzeit-Status (fuer Web-Oberflaeche und KlipperScreen)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_STATE]
description: Laufzeitstatus des Loaders (nicht bearbeiten)
variable_state: "idle"       # idle | loading | unloading | testing | error
variable_op: ""              # prepare | load_cold | load | park | unload | bench | measure
variable_result: ""          # "" | ok | error
variable_msg: ""             # letzte Meldung in der eingestellten Sprache
variable_clamped: 0          # 1 = Servo klemmt
variable_event: 0            # Zaehler - jede Aenderung = ein abgeschlossener Vorgang
variable_fed: 0              # mm vom Loader bis Sensor 2 beim letzten Laden/Messen
variable_pos: "unknown"      # none | loader | tube | sensor2 | gears | nozzle | unknown (gesichert)
variable_tip: 0.0            # mm: Filamentspitze ab Loader-Zahnraedern (gesichert)
variable_tip_known: 0        # 1 = tip ist verlaesslich (sonst vorsichtige Suche beim Laden)
variable_sync_msg: ""        # Hinweis des letzten Abgleichs (z. B. Filament im ausgeschalteten Zustand entfernt)
variable_slip: -999.0        # mm: Sensor 2 kam beim letzten Laden so viel spaeter (+) / frueher (-) als erwartet; -999 = nicht gemessen
variable_slip_speed: 0       # mm/s: Foerdertempo dieser Ladung
variable_e_ref: 0.0          # Extruder-Position beim letzten Positionswechsel - seitdem extrudiert = Filament evtl. in der Duese
variable_cmd: ""             # Befehl des laufenden / letzten Vorgangs (fuer "Wiederholen")
variable_phase: ""           # aktueller Schritt: fast | search | handover | heat | tip | retract | pull | release | back | extrude | purge | reref
variable_err_code: ""        # letzter Fehler: timeout_s2 | timeout_clear | overshoot | s1_lost | no_filament | s2_occupied | no_sensor2 | printing | print_no_filament
variable_err_phase: ""       # Schritt, in dem der Fehler passiert ist
variable_careful: 0          # 1 = naechste Sensorsuche vorsichtig ueber den ganzen Schlauch (Wiederholen nach Fehler)
gcode:


# ---------------------------------------------------------------------
# Position sichern (save_variables) und mit den Sensoren abgleichen
# Die Position ueberlebt Neustarts und Ausschalten. Beim Start vergleicht
# _LOADER_SYNC sie mit den Sensoren und korrigiert sie, wenn Filament im
# ausgeschalteten Zustand entfernt oder eingelegt wurde.
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SAVE]
gcode:
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% if "save_variables" in printer %}
        SAVE_VARIABLE VARIABLE=autoloader_pos VALUE='"{s.pos}"'
        SAVE_VARIABLE VARIABLE=autoloader_tip VALUE={(s.tip|float)|round(1)}
        SAVE_VARIABLE VARIABLE=autoloader_tip_known VALUE={s.tip_known|int}
    {% endif %}

[gcode_macro _LOADER_SET_POS]
description: Position setzen und sichern (POS=, optional TIP=, KNOWN=)
gcode:
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=pos VALUE='"{params.POS}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={params.TIP|default(s.tip)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip_known VALUE={params.KNOWN|default(s.tip_known)|int}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=e_ref VALUE={printer.toolhead.position.e|float}
    _LOADER_SAVE

[gcode_macro _LOADER_POS_FROM_TIP]
description: Nach Loader-Fahrten vor Sensor 2 - Position aus der Spitze ableiten (loader / tube)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set has2 = "filament_switch_sensor toolhead_in" in printer %}
    {% if not has2 and s.pos in ["sensor2", "gears", "nozzle"] %}
    {% elif has2 and printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_SET_POS POS={s.pos if s.pos in ["sensor2", "gears", "nozzle"] else "sensor2"}
    {% elif printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_SET_POS POS={"tube" if s.tip|float > v.unload_hold + 5 else "loader"}
    {% else %}
        _LOADER_SET_POS POS=none TIP=0 KNOWN=1
    {% endif %}

[gcode_macro _LOADER_SYNC]
description: Gesicherte Position mit den Sensoren abgleichen (BOOT=1 beim Start)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set de = v.lang != "en" %}
    {% if params.BOOT|default(0)|int == 1 and "save_variables" in printer %}
        {% set sv = printer.save_variables.variables %}
        {% set pos = sv.get("autoloader_pos", "unknown") %}
        {% set tip = sv.get("autoloader_tip", 0)|float %}
        {% set known = sv.get("autoloader_tip_known", 0)|int %}
    {% else %}
        {% set pos = s.pos %}
        {% set tip = s.tip|float %}
        {% set known = s.tip_known|int %}
    {% endif %}
    {% set s1 = printer["filament_switch_sensor loader_in"].filament_detected %}
    {% set has2 = "filament_switch_sensor toolhead_in" in printer %}
    {% set s2 = has2 and printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set beyond = pos in ["sensor2", "gears", "nozzle"] %}
    {% set new = pos %}
    {% set ntip = tip %}
    {% set nknown = known %}
    {% set note = "" %}
    {% if s2 %}
        {% if not beyond %}
            {% set new = "sensor2" %}
            {% set ntip = v.tube_len %}
            {% set nknown = 1 %}
            {% set note = "Filament an Sensor 2 gefunden - ob der Extruder es greift, ist unbekannt" if de else "Filament found at sensor 2 - unknown whether the extruder grips it" %}
        {% endif %}
    {% elif beyond and has2 %}
        {% if s1 %}
            {% set new = "tube" %}
            {% set nknown = 0 %}
        {% else %}
            {% set new = "none" %}
            {% set ntip = 0 %}
            {% set nknown = 1 %}
        {% endif %}
        {% set note = "Filament ist nicht mehr im Toolhead - wurde es entfernt oder zurueckgezogen?" if de else "Filament is no longer in the toolhead - was it removed or pulled back?" %}
    {% elif s1 %}
        {% if pos == "none" %}
            {% set new = "loader" %}
            {% set ntip = 0 %}
            {% set nknown = 1 if v.auto_enable|default(1)|int == 1 else 0 %}
        {% elif pos not in ["loader", "tube"] and not beyond %}
            {% set new = "loader" %}
            {% set nknown = 0 %}
        {% endif %}
    {% elif pos != "none" %}
        {% set new = "none" %}
        {% set ntip = 0 %}
        {% set nknown = 1 %}
        {% if pos != "unknown" %}
            {% set note = "Filament wurde entfernt" if de else "Filament was removed" %}
        {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=pos VALUE='"{new}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={ntip}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip_known VALUE={nknown}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=sync_msg VALUE='"{note}"'
    {% if new != pos or params.BOOT|default(0)|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=e_ref VALUE={printer.toolhead.position.e|float}
    {% endif %}
    {% if new != pos or ntip != tip or nknown != known or params.BOOT|default(0)|int == 1 %}
        _LOADER_SAVE
    {% endif %}
    {% if note %}
        RESPOND TYPE=error MSG="AutoLoader: {note}"
    {% endif %}

[delayed_gcode _LOADER_BOOT]
initial_duration: 2
gcode:
    _LOADER_SYNC BOOT=1

[gcode_macro LOADER_SYNC]
description: Filament-Position mit den Sensoren abgleichen
gcode:
    _LOADER_SYNC

[gcode_macro LOADER_SET_POS]
description: Filament-Position von Hand setzen - POS=none|loader|tube|sensor2|gears|nozzle (optional TIP= mm ab Loader-Zahnraedern)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set p = params.POS|default("unknown")|lower %}
    {% set d = {"none": 0, "loader": v.unload_hold, "tube": v.tube_len - v.park_dist|default(20),
                "sensor2": v.tube_len, "gears": v.tube_len + v.gear_offset + v.gear_push,
                "nozzle": v.tube_len + v.gear_offset + v.ext_to_nozzle} %}
    {% if p not in d %}
        _LOADER_SAY TYPE=error DE="LOADER_SET_POS - POS muss none, loader, tube, sensor2, gears oder nozzle sein" EN="LOADER_SET_POS - POS must be none, loader, tube, sensor2, gears or nozzle"
    {% else %}
        _LOADER_SET_POS POS={p} TIP={params.TIP|default(d[p])|float} KNOWN=1
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=sync_msg VALUE='""'
        _LOADER_SAY DE="Filament-Position gesetzt - {p}" EN="Filament position set - {p}"
    {% endif %}


# ---------------------------------------------------------------------
# Meldungen
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SAY]
description: Meldung ausgeben (DE=, EN=, optional TYPE=error)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    RESPOND TYPE={params.TYPE|default("echo")} MSG="{m}"

[gcode_macro _LOADER_BEGIN]
description: Vorgang beginnen (OP=, STATE=, CMD= Befehl zum Wiederholen)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=op VALUE='"{params.OP}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"{params.STATE}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=result VALUE='""'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=msg VALUE='""'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=cmd VALUE='"{params.CMD|default("")}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=phase VALUE='""'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=err_code VALUE='""'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=err_phase VALUE='""'

[gcode_macro _LOADER_PHASE]
description: Aktuellen Schritt merken (P=) - zeigt bei einem Abbruch, wo es passiert ist
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=phase VALUE='"{params.P}"'

[gcode_macro LOADER_RESET]
description: Zuruecksetzen, wenn alles schieflaeuft (z. B. Clog) - Servo frei, Loader- und Extruder-Motor aus, Fehler geloescht, Filament-Position neu nach den Sensoren. Braucht CONFIRM=1
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s1 = printer["filament_switch_sensor loader_in"].filament_detected %}
    {% set s2 = "filament_switch_sensor toolhead_in" in printer and printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% if params.CONFIRM|default(0)|int != 1 %}
        _LOADER_DENY DE="LOADER_RESET vergisst die Filament-Position und schaltet die Motoren aus - mit CONFIRM=1 aufrufen" EN="LOADER_RESET forgets the filament position and switches the motors off - call it with CONFIRM=1"
    {% endif %}
    {% if printer.print_stats.state == "printing" %}
        _LOADER_DENY DE="LOADER_RESET ist waehrend eines Drucks nicht moeglich" EN="LOADER_RESET is not possible while printing"
    {% endif %}
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    {% for k in ["op", "msg", "result", "err_code", "err_phase", "phase", "sync_msg"] %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE={k} VALUE='""'
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"idle"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=careful VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=slip VALUE=-999
    {% if s2 %}
        _LOADER_SET_POS POS=unknown TIP={v.tube_len} KNOWN=0
    {% elif s1 %}
        _LOADER_SET_POS POS=tube TIP=0 KNOWN=0
    {% else %}
        _LOADER_SET_POS POS=none TIP=0 KNOWN=1
    {% endif %}
    _LOADER_SAY DE="Loader zurueckgesetzt - Servo frei, Loader- und Extruder-Motor aus, Position vergessen. Das Filament kann jetzt von Hand herausgezogen werden (Extruder-Hebel oeffnen, bei einem Clog Duese heizen). Danach neu einlegen - das naechste Laden sucht Sensor 2 vorsichtig" EN="Loader reset - servo released, loader and extruder motor off, position forgotten. The filament can now be pulled out by hand (open the extruder lever, heat the nozzle for a clog). Then insert it again - the next load searches sensor 2 carefully"

[gcode_macro LOADER_CAREFUL]
description: Die naechste Sensorsuche laeuft vorsichtig ueber den ganzen Schlauch (z. B. vor dem Wiederholen nach einem Fehler)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=careful VALUE=1

[gcode_macro LOADER_ACK]
description: Fehler / abgebrochenen Vorgang quittieren - Servo loesen, Stepper aus, Position mit den Sensoren abgleichen
gcode:
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% if s.clamped|int == 1 %}
        LOADER_STOP
    {% endif %}
    {% if s.state != "idle" %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"idle"'
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=result VALUE='""'
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=err_code VALUE='""'
    _LOADER_SYNC

[gcode_macro _LOADER_END]
description: Vorgang beenden (RESULT=ok/error, DE=, EN=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"{"idle" if params.RESULT == "ok" else "error"}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=result VALUE='"{params.RESULT}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=msg VALUE='"{m}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=event VALUE={s.event + 1}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=careful VALUE=0


# ---------------------------------------------------------------------
# Servo / Stepper Grundfunktionen
# ---------------------------------------------------------------------
[gcode_macro LOADER_CLAMP]
description: Servo drueckt den Hebel -> BMG-Zahnraeder greifen (optional ANGLE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set a = params.ANGLE|default(v.servo_clamp)|float %}
    SET_SERVO SERVO=loader_clamp ANGLE={a}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=clamped VALUE=1
    G4 P{(v.servo_settle * 1000)|int}

[gcode_macro LOADER_RELEASE]
description: Hebel frei -> Filament laeuft frei (optional ANGLE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set a = params.ANGLE|default(v.servo_release)|float %}
    SET_SERVO SERVO=loader_clamp ANGLE={a}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=clamped VALUE=0
    G4 P{(v.servo_settle * 1000)|int}
    {% if v.servo_off_released|int == 1 %}
        SET_SERVO SERVO=loader_clamp WIDTH=0
    {% endif %}

[gcode_macro _LOADER_MOVE_REL]
description: Interner relativer Stepper-Move (DIST in mm, SPEED in mm/s)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set spd = params.SPEED|default(v.speed)|float %}
    MANUAL_STEPPER STEPPER=loader ENABLE=1 SET_POSITION=0 MOVE={params.DIST|float} SPEED={spd}
    M400
    {% if s.clamped|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={s.tip|float + params.DIST|float}
    {% endif %}

[gcode_macro _LOADER_E]
description: Extruder-Move (relativ, M83 vorher setzen) in Stuecken unter max_extrude_only_distance (Standard 50 mm)
gcode:
    {% set d = params.DIST|float %}
    {% set n = ((d|abs) / 40)|round(0, 'ceil')|int %}
    {% for i in range(n) %}
        G1 E{d / n} F{params.F|int}
    {% endfor %}

[gcode_macro LOADER_MOVE]
description: Test: DIST=mm (negativ=zurueck) SPEED=mm/s CLAMP=1/0 - faehrt nie unbeabsichtigt bis Sensor 2 oder gegen den Extruder (sonst FORCE=1)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set clamp = params.CLAMP|default(1)|int %}
    {% set dist = params.DIST|default(0)|float %}
    {% set force = params.FORCE|default(0)|int == 1 %}
    {% set has2 = "filament_switch_sensor toolhead_in" in printer %}
    {% set s2 = has2 and printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set inhead = s2 or s.pos in ["sensor2", "gears", "nozzle"] %}
    {% if "DIST" not in params %}
        _LOADER_DENY DE="LOADER_MOVE braucht DIST=, z. B. LOADER_MOVE DIST=50" EN="LOADER_MOVE needs DIST=, e.g. LOADER_MOVE DIST=50"
    {% elif has2 and clamp == 1 and not force and dist > 0 and (inhead or (s.pos == "tube" and s.tip_known|int == 0) or (s.tip_known|int == 1 and s.tip|float + dist > v.tube_len - 10)) %}
        _LOADER_DENY DE="LOADER_MOVE - die Fahrt koennte bis Sensor 2 oder in den Extruder gehen. Erst entladen, oder bewusst mit FORCE=1" EN="LOADER_MOVE - the move could reach sensor 2 or the extruder. Unload first, or deliberately use FORCE=1"
    {% elif has2 and clamp == 1 and not force and dist < 0 and s2 and s.pos in ["gears", "nozzle"] %}
        _LOADER_DENY DE="LOADER_MOVE - das Filament steckt im Extruder, zum Herausziehen Entladen benutzen (oder bewusst FORCE=1)" EN="LOADER_MOVE - the filament is in the extruder, use unload to pull it out (or deliberately FORCE=1)"
    {% endif %}
    {% if clamp == 1 %}
        LOADER_CLAMP
    {% endif %}
    _LOADER_MOVE_REL DIST={dist} SPEED={params.SPEED|default(v.speed)|float}
    {% if clamp == 1 %}
        LOADER_RELEASE
    {% endif %}
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    {% if clamp == 1 and printer["gcode_macro _LOADER_STATE"].pos in ["none", "loader", "tube", "unknown"] %}
        _LOADER_POS_FROM_TIP
    {% endif %}

[gcode_macro LOADER_STOP]
description: Servo loesen und Stepper stromlos schalten
gcode:
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0

[gcode_macro LOADER_AUTO]
description: Auto-Laden ein/aus (ENABLE=1/0, bis zum Neustart; dauerhaft: auto_enable in den Einstellungen)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_VARS VARIABLE=auto_enable VALUE={params.ENABLE|default(1)|int}

[gcode_macro _LOADER_HEATER_OFF]
description: Duese ausschalten nach Laden/Entladen (heater_off), nie waehrend eines Drucks oder einer Pause
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% if v.heater_off|default(1)|int == 1 and params.PRINT|default(0)|int == 0 and printer.print_stats.state not in ["printing", "paused"] %}
        M104 S0
    {% endif %}

[gcode_macro LOADER_BENCH]
description: Bench-Modus ein/aus (VALUE=1/0, bis zum Neustart; dauerhaft in den Einstellungen)
gcode:
    {% if "VALUE" not in params %}
        _LOADER_DENY DE="LOADER_BENCH braucht VALUE=1 (ein) oder VALUE=0 (aus)" EN="LOADER_BENCH needs VALUE=1 (on) or VALUE=0 (off)"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_LOADER_VARS VARIABLE=bench_mode VALUE={params.VALUE|default(1)|int}

[gcode_macro LOADER_STATUS]
description: Sensor- und Loader-Status anzeigen
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set de = v.lang != "en" %}
    {% set a = ("Filament" if de else "filament") if printer["filament_switch_sensor loader_in"].filament_detected else ("leer" if de else "empty") %}
    {% if "filament_switch_sensor toolhead_in" in printer %}
        {% set b = ("Filament" if de else "filament") if printer["filament_switch_sensor toolhead_in"].filament_detected else ("leer" if de else "empty") %}
    {% else %}
        {% set b = "nicht konfiguriert" if de else "not configured" %}
    {% endif %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set sl = s.slip|default(-999)|float %}
    {% set slt = ("" if sl <= -900 else (" / Abweichung letzte Ladung: " if de else " / deviation on the last load: ") ~ ("+" if sl > 0 else "") ~ (sl|round(1)) ~ " mm @ " ~ (s.slip_speed|int) ~ " mm/s") %}
    {% if de %}
        RESPOND MSG="Loader-Eingang: {a} / Toolhead-Eingang: {b} / Position: {s.pos} ({s.tip|float|round(0)|int} mm{'' if s.tip_known|int == 1 else ', ungenau'}) / Bench-Modus: {'an' if v.bench_mode|int == 1 else 'aus'} / Gleichlauf-Modul: {'aktiv' if 'autoloader_sync' in printer else 'fehlt (./install.sh)'}{slt}"
    {% else %}
        RESPOND MSG="Loader entrance: {a} / toolhead entrance: {b} / position: {s.pos} ({s.tip|float|round(0)|int} mm{'' if s.tip_known|int == 1 else ', approximate'}) / bench mode: {'on' if v.bench_mode|int == 1 else 'off'} / sync module: {'active' if 'autoloader_sync' in printer else 'missing (./install.sh)'}{slt}"
    {% endif %}

[gcode_macro LOADER_BENCHTEST]
description: Bench-Test - Servo klemmt, Stepper faehrt DIST mm, Servo loest (braucht nur Sensor 1)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set dist = params.DIST|default(v.bench_dist)|float %}
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=bench STATE=testing CMD="LOADER_BENCHTEST DIST={dist}"
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set has2 = "filament_switch_sensor toolhead_in" in printer %}
    {% set s2 = has2 and printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_FAIL CODE=no_filament DE="Benchtest - kein Filament an Sensor 1" EN="Bench test - no filament at sensor 1"
    {% elif has2 and (s2 or s.pos in ["sensor2", "gears", "nozzle"] or (s.pos == "tube" and s.tip_known|int == 0) or (s.tip_known|int == 1 and s.tip|float + dist > v.tube_len - 10)) %}
        _LOADER_FAIL CODE=bench_blocked DE="Benchtest - die Teststrecke koennte bis Sensor 2 oder in den Extruder gehen" EN="Bench test - the test distance could reach sensor 2 or the extruder"
    {% else %}
        {% if printer["gcode_macro _LOADER_STATE"].pos == "none" %}
            _LOADER_SET_POS POS=loader TIP=0 KNOWN=1
        {% endif %}
        LOADER_CLAMP
        _LOADER_MOVE_REL DIST={dist} SPEED={v.slow_speed}
        LOADER_RELEASE
        MANUAL_STEPPER STEPPER=loader ENABLE=0
        _LOADER_POS_FROM_TIP
        _LOADER_END RESULT=ok DE="Benchtest fertig" EN="Bench test done"
        _LOADER_SAY DE="Benchtest fertig" EN="Bench test done"
    {% endif %}


# ---------------------------------------------------------------------
# Fehlerbehandlung
# (action_raise_error wird beim Rendern ausgefuehrt -> darum eigenes Macro,
#  damit Servo-Loesen und Meldung vorher laufen)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_RAISE]
gcode:
    {action_raise_error("AutoLoader: " ~ params.MSG)}

[gcode_macro _LOADER_DENY]
description: Befehl ablehnen (DE=, EN=) - der Loader-Zustand bleibt, wie er ist
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    _LOADER_RAISE MSG="{params.EN if v.lang == 'en' else params.DE}"

[gcode_macro _LOADER_FAIL]
description: Servo loesen, Stepper aus, Fehlermeldung, Abbruch (DE=, EN=, CODE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    {% set st = printer["gcode_macro _LOADER_STATE"] %}
    {% set op = st.op %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=err_code VALUE='"{params.CODE|default("error")}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=err_phase VALUE='"{st.phase}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=careful VALUE=0
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    {% if op in ["load", "unload", "park", "prepare"] %}
        _LOADER_HEATER_OFF
    {% endif %}
    _LOADER_POS_FROM_TIP
    _LOADER_END RESULT=error DE="{params.DE}" EN="{params.EN}"
    RESPOND TYPE=error MSG="AutoLoader: {m}"
    _LOADER_RAISE MSG="{m}"

[gcode_macro _LOADER_CHECK_IDLE]
description: Abbruch waehrend eines Drucks (ALLOW=1 nur fuer die PRINT_START/PRINT_END-Hooks)
gcode:
    {% if printer.print_stats.state == "printing" and params.ALLOW|default(0)|int == 0 %}
        _LOADER_FAIL CODE=printing DE="Nicht waehrend eines Drucks moeglich" EN="Not possible while printing"
    {% endif %}

[gcode_macro _LOADER_RUNOUT]
description: runout_gcode von Sensor 1
gcode:
    _LOADER_SAY TYPE=error DE="AutoLoader - Filament am Loader-Eingang fehlt" EN="AutoLoader - filament missing at the loader entrance"


# ---------------------------------------------------------------------
# Sensorsuche
# Klipper verbietet, dass ein Makro sich selbst aufruft. Darum rendert
# _LOADER_SEARCH viele Aufrufe von _LOADER_SEARCH_STEP NACHEINANDER (nicht
# verschachtelt). Jeder Schritt wird erst bei seiner Ausfuehrung gerendert und
# liest den Sensor deshalb frisch; nach dem Treffer tun die restlichen nichts.
#   MODE=load   foerdern, bis Sensor 2 Filament meldet
#   MODE=unload zurueckziehen, bis Sensor 2 frei ist
#   WIN=  mm Suchfenster, BASE= mm schon gefahren (fuer "fed"), MEASURE=1 Messfahrt
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SEARCH_STATE]
variable_mode: "load"
variable_done: 0             # 0 = sucht, 1 = gefunden, 2 = Fenster ausgeschoepft
variable_moved: 0.0
variable_steps: 0
variable_base: 0.0
variable_measure: 0
variable_step: 2.0
variable_speed: 10.0
variable_expect: -1.0        # erwartete Spitzenposition an Sensor 2 (tube_len), -1 = keine Schlupfmessung
variable_quiet: 0            # 1 = grobe Vorsuche: keine Meldung, keine Schlupfmessung
variable_first: 1            # 1 = Suche direkt nach der vollen Fahrt (dann Ueberfahr-Pruefung)
variable_late: 0             # 1 = frisch eingelegt (Spitze evtl. von Hand weitergeschoben): nur Verspaetung zaehlt als Schlupf
gcode:

[gcode_macro _LOADER_SEARCH]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set win = params.WIN|float %}
    {% set step = params.STEP|default(v.step_mm)|float %}
    {% set n = (win / step)|round(0, 'ceil')|int %}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=step VALUE={step}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=speed VALUE={params.SPEED|default(v.slow_speed)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=mode VALUE='"{params.MODE|default("load")}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=moved VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=steps VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=base VALUE={params.BASE|default(0)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=measure VALUE={params.MEASURE|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=expect VALUE={params.EXPECT|default(-1)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=quiet VALUE={params.QUIET|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=first VALUE={params.FIRST|default(1)|int}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=late VALUE={params.LATE|default(0)|int}
    {% for i in range(n + 1) %}
        _LOADER_SEARCH_STEP WIN={win}
    {% endfor %}
    _LOADER_SEARCH_DONE

[gcode_macro _LOADER_SEARCH_STEP]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    {% set th = printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set load = s.mode == "load" %}
    {% set win = params.WIN|float %}
    {% if s.done == 0 %}
        {% if (load and th) or (not load and not th) %}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=1
        {% elif s.moved >= win %}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=2
        {% elif load and not printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_FAIL CODE=s1_lost DE="Filament am Loader-Eingang verschwunden" EN="Filament vanished at the loader entrance"
        {% else %}
            {% set d = [s.step, win - s.moved]|min %}
            _LOADER_MOVE_REL DIST={d if load else -d} SPEED={s.speed}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=moved VALUE={s.moved + d}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=steps VALUE={s.steps + 1}
        {% endif %}
    {% endif %}

[gcode_macro _LOADER_SEARCH_DONE]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    {% set fed = s.base + s.moved %}
    {% if s.done == 1 and not (s.mode == "unload" and s.quiet == 1) %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={fed if s.measure == 1 else v.tube_len}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip_known VALUE={0 if s.mode == "unload" and s.steps == 0 else 1}
    {% endif %}
    {% if s.done != 1 %}
        {% if s.mode == "load" %}
            _LOADER_FAIL CODE=timeout_s2 DE="Timeout - Filament hat Sensor 2 nicht erreicht (nach {fed|round(1)} mm)" EN="Timeout - filament did not reach sensor 2 (after {fed|round(1)} mm)"
        {% else %}
            _LOADER_FAIL CODE=timeout_clear DE="Timeout - Sensor 2 wird nicht frei" EN="Timeout - sensor 2 does not clear"
        {% endif %}
    {% elif s.mode == "load" %}
        {% if s.quiet == 0 %}
            SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=fed VALUE={fed}
        {% endif %}
        {% if s.first == 1 and s.base > 0 and s.steps == 0 %}
            {% if s.measure == 1 %}
                _LOADER_SAY TYPE=error DE="Achtung - Sensor 2 wurde schon waehrend der schnellen Fahrt erreicht, beim naechsten Mal Schnell bis kleiner einstellen. Der Loader sucht den Sensor jetzt rueckwaerts, der Messwert stimmt trotzdem" EN="Warning - sensor 2 was already reached during the fast move, use a smaller Fast up to next time. The loader now searches the sensor backwards, the measured value is still correct"
            {% else %}
                _LOADER_FAIL CODE=overshoot DE="Sensor 2 schon waehrend der vollen Fahrt erreicht - tube_len ist zu gross oder approach zu klein. Filament zurueckziehen und tube_len messen" EN="Sensor 2 was already reached during the full-speed move - tube_len is too large or approach too small. Pull the filament back and measure tube_len"
            {% endif %}
        {% endif %}
        {% if s.quiet == 1 %}
        {% elif s.expect >= 0 and s.measure == 0 %}
            {% set dev = (fed - s.expect)|round(1) %}
            {% if s.late == 1 %}
                {% set dev = [dev, 0]|max %}
            {% endif %}
            {% set sg = "+" if dev > 0 else "" %}
            {% set warn = v.slip_warn|default(10)|float %}
            SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=slip VALUE={dev}
            SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=slip_speed VALUE={v.speed}
            _LOADER_SAY DE="Loader - Sensor 2 nach {fed|round(1)} mm erreicht (Abweichung {sg}{dev} mm)" EN="Loader - sensor 2 reached after {fed|round(1)} mm (deviation {sg}{dev} mm)"
            {% if dev > warn %}
                _LOADER_SAY TYPE=error DE="Achtung - Sensor 2 kam {dev} mm spaeter als erwartet: Schlupf oder Schrittverlust bei {v.speed} mm/s. Beschleunigung (accel) oder Tempo senken, Klemmwinkel pruefen. Ist die Abweichung bei jedem Tempo gleich, tube_len neu messen" EN="Warning - sensor 2 came {dev} mm later than expected: slip or lost steps at {v.speed} mm/s. Lower the acceleration (accel) or the speed, check the clamp angle. If the deviation is the same at every speed, measure tube_len again"
            {% elif dev < -warn %}
                _LOADER_SAY TYPE=error DE="Achtung - Sensor 2 kam {dev|abs} mm frueher als erwartet - tube_len ist zu gross, bitte neu messen" EN="Warning - sensor 2 came {dev|abs} mm earlier than expected - tube_len is too large, please measure it again"
            {% endif %}
        {% else %}
            _LOADER_SAY DE="Loader - Sensor 2 nach {fed|round(1)} mm erreicht" EN="Loader - sensor 2 reached after {fed|round(1)} mm"
        {% endif %}
    {% elif s.quiet == 0 %}
        _LOADER_SAY DE="Loader - Sensor 2 frei" EN="Loader - sensor 2 clear"
    {% endif %}


# ---------------------------------------------------------------------
# Laden: volle Fahrt (speed) bis "approach" mm vor Sensor 2, dann Sensorsuche
# ---------------------------------------------------------------------
[gcode_macro _LOADER_NEED_TOOLHEAD_SENSOR]
gcode:
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_FAIL CODE=no_sensor2 DE="Sensor 2 (toolhead_in) ist nicht konfiguriert - in den Einstellungen aktivieren" EN="Sensor 2 (toolhead_in) is not configured - enable it in the settings"
    {% endif %}

[gcode_macro _LOADER_LOAD_TO_GEARS]
description: Loader foerdert Filament bis in die Extruder-Zahnraeder, greift kalt, dann Servo frei
gcode:
    _LOADER_TO_SENSOR2
    _LOADER_HANDOVER CLAMP=0

[gcode_macro _LOADER_TO_SENSOR2]
description: Loader foerdert bis Sensor 2 (volle Fahrt + Sensorsuche) - Servo bleibt geklemmt
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_FAIL CODE=no_filament DE="Kein Filament am Loader-Eingang" EN="No filament at the loader entrance"
    {% endif %}
    {% if printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_FAIL CODE=s2_occupied DE="Toolhead-Sensor meldet bereits Filament - erst entladen" EN="Toolhead sensor already reports filament - unload first"
    {% endif %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set approach = v.approach|default(30)|float %}
    {% set careful = s.careful|int == 1 %}
    {% set fresh = not careful and (s.pos == "none" or (s.pos == "loader" and s.tip|float < 0.5)) %}
    {% set tip = 0 if fresh else s.tip|float %}
    {% set known = not careful and (fresh or s.tip_known|int == 1) %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=careful VALUE=0
    {% set margin = 50 if fresh else 0 %}
    {% set cstep = [[5, v.gear_offset - 2]|min, v.step_mm]|max %}
    {% set cspeed = [v.speed, 60]|min %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=slip VALUE=-999
    {% if s.pos == "none" %}
        _LOADER_SET_POS POS=loader TIP=0 KNOWN=1
    {% endif %}
    LOADER_CLAMP
    {% if known %}
        {% set coarse = [v.tube_len - approach - margin - tip, 0]|max %}
        {% if coarse > 0 %}
            _LOADER_PHASE P=fast
            _LOADER_MOVE_REL DIST={coarse} SPEED={v.speed}
        {% endif %}
        _LOADER_PHASE P=search
        _LOADER_SEARCH MODE=load WIN={approach + margin + v.overrun} STEP={cstep} SPEED={cspeed} BASE={tip + coarse} QUIET=1
        _LOADER_REFINE EXPECT={v.tube_len if coarse > 0 else -1} LATE={1 if fresh else 0}
    {% else %}
        {% if careful %}
            _LOADER_SAY DE="Loader - vorsichtige Suche nach Sensor 2 ueber den ganzen Schlauch" EN="Loader - careful search for sensor 2 along the whole tube"
        {% else %}
            _LOADER_SAY DE="Loader - Position im Schlauch unbekannt, suche Sensor 2 vorsichtig" EN="Loader - position in the tube unknown, searching sensor 2 carefully"
        {% endif %}
        _LOADER_PHASE P=search
        _LOADER_SEARCH MODE=load WIN={v.tube_len + v.overrun + 50} STEP={cstep} SPEED={cspeed} QUIET=1
        _LOADER_REFINE
    {% endif %}

[gcode_macro _LOADER_REFINE]
description: Nach der groben Suche ein Stueck zurueck (bis Sensor 2 sicher frei ist) und in feinen Schritten (step_mm) noch einmal bis Sensor 2 - die Spitze steht dann hoechstens step_mm hinter dem Sensor (MEASURE=1 fuer Messfahrten)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set ss = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    {% set back = ss.step + 3 %}
    {% set fed0 = ss.base + ss.moved - back %}
    {% set over = ss.steps == 0 and ss.base > 0 %}
    _LOADER_MOVE_REL DIST=-{back} SPEED={v.slow_speed}
    {% if over %}
        _LOADER_SEARCH MODE=unload WIN={ss.base + 5} STEP={ss.step} SPEED={ss.speed} QUIET=1 FIRST=0
    {% else %}
        _LOADER_SEARCH MODE=unload WIN=25 QUIET=1 FIRST=0
    {% endif %}
    _LOADER_REFINE_FINE FED0={fed0} EXPECT={params.EXPECT|default(-1)} MEASURE={params.MEASURE|default(0)} LATE={params.LATE|default(0)}

[gcode_macro _LOADER_REFINE_FINE]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set ss = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    _LOADER_SEARCH MODE=load WIN={2 * ss.step + 4 * v.step_mm + 10} BASE={params.FED0|float - ss.moved} EXPECT={params.EXPECT} MEASURE={params.MEASURE} LATE={params.LATE} FIRST=0

[gcode_macro _LOADER_HANDOVER]
description: Spitze von Sensor 2 in den Extruder - ab Sensor 2 fahren Loader und Extruder gleichzeitig (LOADER_DUAL_MOVE), die Extruder-Zahnraeder drehen also schon, bevor die Spitze ankommt (unabhaengig davon, wie genau gear_offset stimmt)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set tip0 = [s.tip|float, v.tube_len]|max if s.tip_known|int == 1 else v.tube_len %}
    {% set grip = v.grip_len|default(0)|float %}
    {% set target = v.tube_len + v.gear_offset + v.gear_push + grip %}
    {% set d = [target - tip0, 0]|max %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={tip0}
    _LOADER_PHASE P=handover
    {% if params.CLAMP|default(1)|int == 1 %}
        LOADER_CLAMP
    {% endif %}
    {% if d > 0 %}
        _LOADER_MOVE_BOTH DIST={d}
    {% endif %}
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    _LOADER_SET_POS POS=gears

[gcode_macro _LOADER_MOVE_BOTH]
description: Loader und Extruder fahren gleichzeitig DIST mm (SPEED=, Standard grip_speed) - ueber das Klipper-Modul autoloader_sync, geht auch bei kalter Duese (es wird nichts extrudiert)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set d = params.DIST|float %}
    {% set sp = [params.SPEED|default(v.grip_speed|default(5))|float, 50]|min %}
    {% set ms = printer.configfile.settings["manual_stepper loader"]|default({}) %}
    {% set acc = ms.accel|default(0)|float %}
    {% if "autoloader_sync" not in printer %}
        _LOADER_NO_SYNC
    {% endif %}
    M400
    LOADER_DUAL_MOVE DIST={d} SPEED={sp} ACCEL={acc if acc > 0 else 300}
    {% if s.clamped|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={s.tip|float + d}
    {% endif %}

[gcode_macro _LOADER_NO_SYNC]
description: Abbruch - ohne das Klipper-Modul autoloader_sync koennen Loader und Extruder nicht gleichzeitig fahren (nacheinander staucht sich das Filament)
gcode:
    _LOADER_FAIL CODE=no_sync_module DE="Das Klipper-Modul autoloader_sync fehlt - ohne es koennen Loader und Extruder nicht gleichzeitig fahren. Einmal per SSH ausfuehren: cd ~/Voron0-AutoLoader und ./install.sh" EN="The Klipper module autoloader_sync is missing - without it loader and extruder cannot move at the same time. Run once via SSH: cd ~/Voron0-AutoLoader and ./install.sh"

[gcode_macro _LOADER_NEED_SYNC]
description: Vorab-Pruefung (COND=1): Vorgang braucht gleichzeitiges Fahren, Modul fehlt -> Abbruch, bevor sich etwas bewegt
gcode:
    {% if params.COND|default(1)|int == 1 and "autoloader_sync" not in printer %}
        _LOADER_NO_SYNC
    {% endif %}

[gcode_macro _LOADER_COLD_OUT]
description: Filament kalt aus dem Toolhead (nicht geschmolzen): Loader und Extruder ziehen die Spitze gemeinsam aus den Extruder-Zahnraedern bis kurz hinter Sensor 2, mit SEARCH=1 danach zurueck bis Sensor 2 frei
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set out = v.tube_len + [2.5, v.gear_offset * 0.3]|min %}
    {% set d = [s.tip|float - out, 0]|max if s.pos == "gears" and s.tip_known|int == 1 else 0 %}
    _LOADER_PHASE P=release
    LOADER_CLAMP
    {% if d > 0.5 %}
        _LOADER_MOVE_BOTH DIST=-{[d, 150]|min}
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    {% if params.SEARCH|default(1)|int == 1 %}
        _LOADER_PHASE P=pull
        _LOADER_SEARCH MODE=unload WIN={v.gear_offset + v.gear_push + 30}
    {% endif %}

[gcode_macro _LOADER_TO_NOZZLE]
description: Extruder foerdert bis zur Duese - abzueglich dessen, was beim kalten Greifen schon gefoerdert wurde
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set base = v.tube_len + v.gear_offset + v.gear_push %}
    {% set done = [[s.tip|float - base, 0]|max, v.ext_to_nozzle]|min if s.pos == "gears" and s.tip_known|int == 1 else 0 %}
    _LOADER_E DIST={v.ext_to_nozzle - done} F={(v.ext_speed * 60)|int}

[gcode_macro FILAMENT_PREPARE]
description: Filament vorbereiten - bis Sensor 2 foerdern und dort stoppen (noch nicht im Extruder, laesst sich auch ausgeschaltet von Hand herausziehen). TEMP= nur, falls es erst aus der Duese muss
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set prep = [2.5, v.gear_offset * 0.3]|min %}
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=prepare STATE=loading CMD="FILAMENT_PREPARE TEMP={temp}"
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% if "filament_switch_sensor toolhead_in" in printer %}
        {% set s2 = printer["filament_switch_sensor toolhead_in"].filament_detected %}
        {% set de = (printer.toolhead.position.e|float - s.e_ref|float)|abs %}
        _LOADER_NEED_SYNC COND={1 if s2 and s.pos != "sensor2" else 0}
        {% if s2 and s.pos == "sensor2" %}
            _LOADER_END RESULT=ok DE="Filament ist schon vorbereitet" EN="Filament is already prepared"
        {% elif s2 and s.pos == "gears" and de <= 2 %}
            _LOADER_COLD_OUT SEARCH=0
            LOADER_RELEASE
            MANUAL_STEPPER STEPPER=loader ENABLE=0
            _LOADER_SET_POS POS=sensor2
            _LOADER_END RESULT=ok DE="Filament aus dem Extruder geloest - steht an Sensor 2" EN="Filament released from the extruder - waiting at sensor 2"
            _LOADER_SAY DE="Loader - Filament aus dem Extruder geloest, steht an Sensor 2" EN="Loader - filament released from the extruder, waiting at sensor 2"
        {% else %}
            {% if s2 %}
                _LOADER_SAY DE="Loader - Filament ist in der Duese - erst heiss herausziehen" EN="Loader - filament is in the nozzle - pulling it out hot first"
                _LOADER_OUT_OF_TOOLHEAD TEMP={temp}
                _LOADER_HEATER_OFF
            {% endif %}
            _LOADER_TO_SENSOR2
            _LOADER_MOVE_REL DIST={prep} SPEED={v.slow_speed}
            LOADER_RELEASE
            MANUAL_STEPPER STEPPER=loader ENABLE=0
            _LOADER_SET_POS POS=sensor2
            _LOADER_END RESULT=ok DE="Filament vorbereitet - steht an Sensor 2" EN="Filament prepared - waiting at sensor 2"
            _LOADER_SAY DE="Loader - Filament vorbereitet, steht an Sensor 2 (noch nicht im Extruder)" EN="Loader - filament prepared, waiting at sensor 2 (not in the extruder yet)"
        {% endif %}
    {% endif %}

[gcode_macro FILAMENT_LOAD_COLD]
description: Filament laden - bis in die Extruder-Zahnraeder, der Extruder greift kalt mit (grip_len). Hotend bleibt kalt
gcode:
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=load_cold STATE=loading CMD="FILAMENT_LOAD_COLD"
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% set loaded = "filament_switch_sensor toolhead_in" in printer and printer["filament_switch_sensor toolhead_in"].filament_detected and printer["gcode_macro _LOADER_STATE"].pos in ["gears", "nozzle"] %}
    {% if loaded %}
        _LOADER_END RESULT=ok DE="Filament ist schon geladen" EN="Filament is already loaded"
    {% elif "autoloader_sync" not in printer %}
        _LOADER_NO_SYNC
    {% else %}
        {% if "filament_switch_sensor toolhead_in" in printer and printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_HANDOVER
        {% else %}
            _LOADER_LOAD_TO_GEARS
        {% endif %}
        _LOADER_END RESULT=ok DE="Filament sitzt im Extruder - bereit zum Drucken" EN="Filament is seated in the extruder - ready to print"
        _LOADER_SAY DE="Loader - Filament sitzt im Extruder, bereit zum Drucken (Heiss laden oder Druckstart foerdert bis zur Duese)" EN="Loader - filament is seated in the extruder, ready to print (load hot or the print start feeds it to the nozzle)"
    {% endif %}

[gcode_macro FILAMENT_LOAD]
description: Filament laden und bis in die Duese foerdern (TEMP=, PURGE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set temp = params.TEMP|default(v.default_temp)|float %}
    {% set purge = params.PURGE|default(v.purge_len)|float %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=load STATE=loading CMD="FILAMENT_LOAD TEMP={temp} PURGE={purge}"
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_NEED_TOOLHEAD_SENSOR
    {% else %}
        {% set st = printer["gcode_macro _LOADER_STATE"] %}
        {% set pos = st.pos %}
        {% set melted = pos == "nozzle" or (pos == "gears" and (printer.toolhead.position.e|float - st.e_ref|float)|abs > 2) %}
        {% set s2 = printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_NEED_SYNC COND={0 if s2 and pos in ["gears", "nozzle"] else 1}
        M104 S{temp}
        {% if not s2 %}
            _LOADER_LOAD_TO_GEARS
        {% elif pos not in ["gears", "nozzle"] %}
            _LOADER_HANDOVER
        {% endif %}
        _LOADER_PHASE P=heat
        M109 S{temp}
        SAVE_GCODE_STATE NAME=_LOADER
        M83
        {% if not melted or not printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_PHASE P=extrude
            _LOADER_TO_NOZZLE
        {% endif %}
        {% if purge > 0 %}
            _LOADER_PHASE P=purge
            _LOADER_E DIST={purge} F={(v.purge_speed * 60)|int}
        {% endif %}
        M400
        RESTORE_GCODE_STATE NAME=_LOADER
        _LOADER_SET_POS POS=nozzle TIP={v.tube_len + v.gear_offset + v.ext_to_nozzle} KNOWN=1
        _LOADER_HEATER_OFF PRINT={params.PRINT|default(0)|int}
        _LOADER_END RESULT=ok DE="Filament geladen" EN="Filament loaded"
        _LOADER_SAY DE="Loader - Filament geladen" EN="Loader - filament loaded"
    {% endif %}

[gcode_macro FILAMENT_LOADER_AUTO]
description: Wird von Sensor 1 ausgeloest (insert_gcode) - auto_enable, auto_target (prepare/cold/hot), bench_mode
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% if v.auto_enable|default(1)|int == 1 %}
        G4 P{(v.auto_delay * 1000)|int}
        _LOADER_AUTO_GO
    {% endif %}

[gcode_macro _LOADER_AUTO_GO]
description: Auto-Laden nach der Wartezeit - nur, wenn das Filament noch am Eingang ist. In einer Druckpause immer bis zur Duese (Filamentwechsel)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set tgt_mode = v.auto_target|default("cold") %}
    {% set dual = "autoloader_sync" in printer %}
    {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_SAY DE="Loader - Auto-Laden abgebrochen, Filament wurde wieder entfernt" EN="Loader - auto load cancelled, the filament was removed again"
    {% elif v.bench_mode|int == 1 %}
        LOADER_BENCHTEST
    {% elif printer.print_stats.state == "paused" %}
        _LOADER_SAY DE="Loader - Druckpause: Filamentwechsel, lade bis zur Duese" EN="Loader - print paused: filament change, loading to the nozzle"
        FILAMENT_LOAD TEMP={tgt if tgt > 0 else v.default_temp}
    {% elif tgt_mode == "hot" %}
        FILAMENT_LOAD TEMP={tgt if tgt > 0 else v.default_temp}
    {% elif tgt_mode == "prepare" %}
        FILAMENT_PREPARE
    {% elif not dual %}
        _LOADER_SAY DE="Loader - Auto-Laden: nur vorbereitet, das Klipper-Modul autoloader_sync fehlt (./install.sh)" EN="Loader - auto load: prepared only, the Klipper module autoloader_sync is missing (./install.sh)"
        FILAMENT_PREPARE
    {% else %}
        FILAMENT_LOAD_COLD
    {% endif %}


# ---------------------------------------------------------------------
# Tip-Forming (Ablauf wie ERCF / Happy Hare / PrusaSlicer-Wipe-Tower)
# 1. optional rammen (tip_ram_len)
# 2. schnell aus der Schmelzzone reissen, dann langsamer bis in die
#    Kuehlzone (tip_cool_pos mm oberhalb der Duese)
# 3. optional Temperatur senken (tip_temp, ohne Warten)
# 4. tip_cool_moves Kuehlbewegungen um tip_cool_len, Tempo steigt von
#    tip_cool_start auf tip_cool_end -> duenne, feste Spitze ohne Faden
# Danach steht die Spitze ca. tip_cool_pos mm ueber der Duese.
# ---------------------------------------------------------------------
[gcode_macro _LOADER_FORM_TIP]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set ram = v.tip_ram_len|default(0)|float %}
    {% set ttemp = v.tip_temp|default(0)|float %}
    {% set s0 = v.tip_speed_start|default(80)|float %}
    {% set s1 = v.tip_speed|default(18)|float %}
    {% set pos = v.tip_cool_pos|default(35)|float %}
    {% set clen = v.tip_cool_len|default(10)|float %}
    {% set moves = v.tip_cool_moves|default(4)|int %}
    {% set c0 = v.tip_cool_start|default(10)|float %}
    {% set c1 = v.tip_cool_end|default(50)|float %}
    {% set first = [15, pos]|min %}
    {% set rest = pos - first %}
    {% set inc = (c1 - c0) / ([2 * moves - 1, 1]|max) %}
    SAVE_GCODE_STATE NAME=_LOADER_TIP
    M83
    {% if ram > 0 %}
        G1 E{ram} F{(v.ext_speed * 60)|int}
    {% endif %}
    G1 E-{first} F{(s0 * 60)|int}
    {% if rest > 0 %}
        G1 E-{rest * 0.7} F{(s1 * 60)|int}
        G1 E-{rest * 0.2} F{(s1 * 30)|int}
        G1 E-{rest * 0.1} F{(s1 * 18)|int}
    {% endif %}
    {% if ttemp > 0 %}
        M104 S{ttemp}
    {% endif %}
    {% for i in range(moves) %}
        {% set sp = c0 + inc * i * 2 %}
        G1 E{clen} F{(sp * 60)|int}
        G1 E-{clen} F{((sp + inc) * 60)|int}
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=_LOADER_TIP

[gcode_macro LOADER_FORM_TIP]
description: Nur Spitze formen (TEMP=), Filament bleibt im Extruder - zum Einstellen der Tip-Parameter
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set s2 = "filament_switch_sensor toolhead_in" in printer and printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set de = (printer.toolhead.position.e|float - s.e_ref|float)|abs %}
    {% set molten = s2 and (s.pos not in ["sensor2", "gears"] or de > 2) %}
    _LOADER_CHECK_IDLE
    {% if not molten %}
        _LOADER_DENY DE="LOADER_FORM_TIP - es ist kein Filament in der Duese" EN="LOADER_FORM_TIP - there is no filament in the nozzle"
    {% endif %}
    M109 S{temp}
    _LOADER_FORM_TIP
    _LOADER_SET_POS POS=gears TIP={v.tube_len + v.gear_offset + v.gear_push + [v.ext_to_nozzle - v.tip_cool_pos|default(35), 0]|max} KNOWN=1
    _LOADER_SAY DE="Spitze geformt, das Filament steht jetzt ueber der Schmelzzone - mit FILAMENT_UNLOAD entladen (kalt) oder von Hand ziehen und pruefen" EN="Tip formed, the filament is now above the melt zone - unload with FILAMENT_UNLOAD (cold) or pull by hand and inspect"


# ---------------------------------------------------------------------
# Entladen und Parken - je nach Filament-Position:
# - in der Duese (nozzle, oder seit dem Laden wurde extrudiert): heizen,
#   Spitze formen (tip_enable), Extruder zieht unload_ext_len zurueck,
#   Loader zieht, bis Sensor 2 frei ist
# - nur vorbereitet (sensor2) oder kalt im Extruder (gears): ohne Heizen -
#   Extruder und Loader loesen die Spitze gemeinsam aus den Zahnraedern
#   (gleichzeitig, LOADER_DUAL_MOVE), Loader zieht, bis Sensor 2 frei ist
# Danach: Entladen bis unload_hold mm im Loader, Parken park_dist mm
# hinter Sensor 2 (Filament bleibt im Schlauch, naechstes Laden ist schnell)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_OUT_OF_TOOLHEAD]
description: Spitze formen (Loader frei), dann ziehen Loader und Extruder das Filament gleichzeitig aus dem Extruder bis kurz hinter Sensor 2, danach zieht der Loader, bis Sensor 2 frei ist (TEMP=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tip = v.tip_enable|default(1)|int == 1 %}
    {% set done = v.tip_cool_pos|default(35)|float if tip else 0 %}
    {% set eject = v.tip_eject_speed|default(25)|float if tip else v.ext_speed %}
    {% set tip_now = v.tube_len + v.gear_offset + v.ext_to_nozzle - done %}
    {% set out = v.tube_len + [2.5, v.gear_offset * 0.3]|min %}
    {% set back = [v.unload_ext_len - done, tip_now - out]|max %}
    LOADER_RELEASE
    _LOADER_PHASE P=heat
    M109 S{params.TEMP|float}
    {% if tip %}
        _LOADER_PHASE P=tip
        _LOADER_FORM_TIP
    {% endif %}
    _LOADER_PHASE P=retract
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=tip VALUE={tip_now}
    LOADER_CLAMP
    {% if back > 0.5 %}
        _LOADER_MOVE_BOTH DIST=-{back} SPEED={eject}
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    _LOADER_PHASE P=pull
    _LOADER_SEARCH MODE=unload WIN={[tip_now - back - v.tube_len, 0]|max + done + 30}

[gcode_macro _LOADER_BACK_TO]
description: Filament vor Sensor 2 auf TIP= mm ab Loader-Zahnraedern zurueckziehen (Servo klemmt dabei)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set d = s.tip|float - params.TIP|float %}
    _LOADER_PHASE P=back
    {% if d > 0.5 %}
        {% if s.clamped|int == 0 %}
            LOADER_CLAMP
        {% endif %}
        _LOADER_MOVE_REL DIST=-{d} SPEED={v.speed}
    {% endif %}
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0

[gcode_macro _LOADER_RETRACT]
description: Entladen (OP=unload) oder Parken (OP=park) je nach Filament-Position - heizt nur, wenn das Filament in der Duese sein kann (TEMP=, PRINT=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set park = params.OP == "park" %}
    {% set target = (v.tube_len - v.park_dist|default(20)) if park else v.unload_hold %}
    {% set newpos = "tube" if park else "loader" %}
    {% set s1 = printer["filament_switch_sensor loader_in"].filament_detected %}
    {% set s2 = printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set de = (printer.toolhead.position.e|float - s.e_ref|float)|abs %}
    {% set cold = s.pos in ["sensor2", "gears"] and de <= 2 and params.HOT|default(0)|int == 0 %}
    {% set done_de = "Geparkt im Schlauch" if park else "Entladen fertig" %}
    {% set done_en = "Parked in the tube" if park else "Unload done" %}
    _LOADER_NEED_SYNC COND={1 if s2 and (s.pos != "sensor2" or not cold) else 0}
    {% if s2 %}
        {% if cold %}
            _LOADER_SAY DE="Loader - Filament ist nicht in der Duese - wird kalt zurueckgezogen, die Duese bleibt aus" EN="Loader - the filament is not in the nozzle - pulling it back cold, the nozzle stays off"
            _LOADER_COLD_OUT
        {% else %}
            _LOADER_OUT_OF_TOOLHEAD TEMP={params.TEMP}
        {% endif %}
        _LOADER_REREF
        _LOADER_BACK_TO TIP={target}
        _LOADER_SET_POS POS={newpos} TIP={target} KNOWN=1
        {% if not cold %}
            _LOADER_HEATER_OFF PRINT={params.PRINT|default(0)|int}
        {% endif %}
        _LOADER_END RESULT=ok DE="{done_de}" EN="{done_en}"
        _LOADER_SAY DE="Loader - {done_de}" EN="Loader - {done_en}"
    {% elif not s1 %}
        _LOADER_END RESULT=ok DE="Kein Filament im Loader - nichts zu tun" EN="No filament in the loader - nothing to do"
        _LOADER_SAY DE="Loader - kein Filament im Loader, nichts zu tun" EN="Loader - no filament in the loader, nothing to do"
    {% elif s.pos in ["none", "loader", "tube"] and s.tip_known|int == 1 %}
        {% if s.tip|float > target + 0.5 %}
            _LOADER_BACK_TO TIP={target}
            _LOADER_SET_POS POS={newpos} TIP={target} KNOWN=1
            _LOADER_END RESULT=ok DE="{done_de}" EN="{done_en}"
            _LOADER_SAY DE="Loader - {done_de}" EN="Loader - {done_en}"
        {% else %}
            _LOADER_END RESULT=ok DE="Filament ist schon dort" EN="The filament is already there"
        {% endif %}
    {% else %}
        _LOADER_SAY DE="Loader - Stelle im Schlauch unbekannt - erst bis Sensor 2 vor, dann zurueck" EN="Loader - position in the tube unknown - forward to sensor 2 first, then back"
        _LOADER_TO_SENSOR2
        _LOADER_COLD_OUT
        _LOADER_BACK_TO TIP={target}
        _LOADER_SET_POS POS={newpos} TIP={target} KNOWN=1
        _LOADER_END RESULT=ok DE="{done_de}" EN="{done_en}"
        _LOADER_SAY DE="Loader - {done_de}" EN="Loader - {done_en}"
    {% endif %}

[gcode_macro _LOADER_REREF]
description: War Sensor 2 nach dem Herausziehen schon frei, steckt die Spitze irgendwo im Schlauch - erst wieder bis Sensor 2, dann knapp zurueck
gcode:
    {% if printer["gcode_macro _LOADER_STATE"].tip_known|int == 0 %}
        _LOADER_PHASE P=reref
        _LOADER_SAY DE="Loader - Sensor 2 war schon frei, die Spitze wird neu gesucht" EN="Loader - sensor 2 was already clear, searching the tip again"
        _LOADER_TO_SENSOR2
        _LOADER_SEARCH MODE=unload WIN=30
    {% endif %}

[gcode_macro FILAMENT_UNLOAD]
description: Filament entladen - bis auf unload_hold mm in den Loader. Heizt (TEMP=) und formt die Spitze nur, wenn das Filament in der Duese sein kann (HOT=1 heizt immer)
gcode:
    # Mainsail gibt seinen Button bei kalter Duese nur frei, wenn im Makro
    # "printer.extruder.can_extrude" vorkommt - das Makro heizt selbst, wenn noetig.
    # (Kein Jinja-Kommentar: Klipper schneidet alles ab "#" ab.)
    {% set hot_now = printer.extruder.can_extrude %}
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=unload STATE=unloading CMD="FILAMENT_UNLOAD TEMP={params.TEMP|default(v.default_temp)|float}"
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% if "filament_switch_sensor toolhead_in" in printer %}
        _LOADER_RETRACT OP=unload TEMP={params.TEMP|default(v.default_temp)|float} PRINT={params.PRINT|default(0)|int} HOT={params.HOT|default(0)|int}
    {% endif %}

[gcode_macro FILAMENT_PARK]
description: Filament park_dist mm hinter Sensor 2 in den Schlauch zurueckziehen. Heizt (TEMP=) und formt die Spitze nur, wenn das Filament in der Duese sein kann (HOT=1 heizt immer)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=park STATE=unloading CMD="FILAMENT_PARK TEMP={params.TEMP|default(v.default_temp)|float}"
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% if "filament_switch_sensor toolhead_in" in printer %}
        _LOADER_RETRACT OP=park TEMP={params.TEMP|default(v.default_temp)|float} PRINT={params.PRINT|default(0)|int} HOT={params.HOT|default(0)|int}
    {% endif %}


# ---------------------------------------------------------------------
# Mainsail / KlipperScreen: deren Lade-Buttons rufen LOAD_FILAMENT und
# UNLOAD_FILAMENT auf. Temperatur: TEMP=, sonst aktuelles Ziel, sonst default_temp.
# ---------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Filament laden (AutoLoader) - TEMP=, PURGE=
gcode:
    # Mainsail gibt seinen Button bei kalter Duese nur frei, wenn im Makro
    # "printer.extruder.can_extrude" vorkommt - das Makro heizt selbst, wenn noetig.
    # (Kein Jinja-Kommentar: Klipper schneidet alles ab "#" ab.)
    {% set hot_now = printer.extruder.can_extrude %}
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set purge = params.PURGE|default(v.purge_len)|float %}
    FILAMENT_LOAD TEMP={temp} PURGE={purge}

[gcode_macro UNLOAD_FILAMENT]
description: Filament entladen (AutoLoader) - heizt nur, wenn das Filament in der Duese ist - TEMP=
gcode:
    # Mainsail gibt seinen Button bei kalter Duese nur frei, wenn im Makro
    # "printer.extruder.can_extrude" vorkommt - das Makro heizt selbst, wenn noetig.
    # (Kein Jinja-Kommentar: Klipper schneidet alles ab "#" ab.)
    {% set hot_now = printer.extruder.can_extrude %}
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    FILAMENT_UNLOAD TEMP={temp}


# ---------------------------------------------------------------------
# Druck-Hooks (vom Installer in PRINT_START / PRINT_END eingefuegt)
# ---------------------------------------------------------------------
[gcode_macro LOADER_PRINT_START]
description: In PRINT_START nach dem Aufheizen der Duese - schaut, wo das Filament ist, und laedt bis zur Duese (print_start_mode)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set mode = v.print_start_mode|default(2)|int %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set has_tool = "filament_switch_sensor toolhead_in" in printer %}
    {% set s2 = has_tool and printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set de = (printer.toolhead.position.e|float - s.e_ref|float)|abs %}
    {% set staged = s.pos in ["sensor2", "gears"] and de <= 2 %}
    {% if mode > 0 and has_tool %}
        {% if s2 and staged %}
            {% if s.pos == "sensor2" %}
                _LOADER_SAY DE="Druckstart - Filament steht an Sensor 2, AutoLoader laedt bis zur Duese" EN="Print start - filament is waiting at sensor 2, AutoLoader loads it to the nozzle"
            {% else %}
                _LOADER_SAY DE="Druckstart - Filament steckt im Extruder, AutoLoader foerdert bis zur Duese" EN="Print start - filament is in the extruder, AutoLoader feeds it to the nozzle"
            {% endif %}
            FILAMENT_LOAD TEMP={temp} PURGE=0 PRINT=1
        {% elif s2 %}
            {% if s.pos != "nozzle" %}
                _LOADER_SET_POS POS=nozzle TIP={v.tube_len + v.gear_offset + v.ext_to_nozzle} KNOWN=1
            {% endif %}
            _LOADER_SAY DE="Druckstart - Filament ist geladen" EN="Print start - filament is loaded"
        {% elif mode == 2 and printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_SAY DE="Druckstart - kein Filament im Toolhead, AutoLoader laedt" EN="Print start - no filament in the toolhead, AutoLoader is loading"
            FILAMENT_LOAD TEMP={temp} PURGE=0 PRINT=1
        {% else %}
            _LOADER_FAIL CODE=print_no_filament DE="Druckstart abgebrochen - kein Filament im Toolhead" EN="Print start aborted - no filament in the toolhead"
        {% endif %}
    {% endif %}

[gcode_macro LOADER_PRINT_END]
description: In PRINT_END vor TURN_OFF_HEATERS - print_end_action 0 nichts, 1 parken, 2 entladen
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set act = v.print_end_action|default(2 if v.unload_after_print|default(0)|int == 1 else 0)|int %}
    {% if act > 0 and "filament_switch_sensor toolhead_in" in printer %}
        {% if printer["filament_switch_sensor toolhead_in"].filament_detected %}
            {% if act == 1 %}
                FILAMENT_PARK TEMP={tgt if tgt > 0 else v.default_temp} PRINT=1
            {% else %}
                FILAMENT_UNLOAD TEMP={tgt if tgt > 0 else v.default_temp} PRINT=1
            {% endif %}
        {% endif %}
    {% endif %}


# ---------------------------------------------------------------------
# Messhelfer (Web-Oberflaeche: Stepper kalibrieren -> Laengen messen)
# ---------------------------------------------------------------------
[gcode_macro LOADER_TO_SENSOR]
description: Messen - foerdert bis Sensor 2 und stoppt dort (Weg -> tube_len). COARSE= mm volle Fahrt, MAX= mm hoechstens, HOLD=1 bleibt geklemmt
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set approach = v.approach|default(30)|float %}
    {% set coarse = params.COARSE|default([v.tube_len - approach - 30, 0]|max)|float %}
    {% set maxlen = params.MAX|default(v.tube_len + v.overrun + 40)|float %}
    {% set window = [maxlen - coarse, 2 * v.step_mm]|max %}
    {% if "COARSE" not in params %}
        _LOADER_DENY DE="LOADER_TO_SENSOR ist eine Messfahrt - auf der AutoLoader-Seite unter Laengen messen starten (oder mit COARSE= und MAX=)" EN="LOADER_TO_SENSOR is a measuring run - start it on the AutoLoader page under Measure lengths (or with COARSE= and MAX=)"
    {% endif %}
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=measure STATE=loading CMD="LOADER_TO_SENSOR COARSE={coarse} MAX={maxlen} HOLD={params.HOLD|default(0)|int}"
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% if "filament_switch_sensor toolhead_in" in printer %}
        {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_FAIL CODE=no_filament DE="Kein Filament am Loader-Eingang" EN="No filament at the loader entrance"
        {% elif printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_FAIL CODE=s2_occupied DE="Sensor 2 meldet bereits Filament - erst zurueckziehen" EN="Sensor 2 already reports filament - pull back first"
        {% else %}
            _LOADER_SET_POS POS=loader TIP=0 KNOWN=1
            LOADER_CLAMP
            {% if coarse > 0 %}
                _LOADER_MOVE_REL DIST={coarse} SPEED={v.speed}
            {% endif %}
            _LOADER_SEARCH MODE=load WIN={window} BASE={coarse} MEASURE=1 QUIET=1 STEP={[[5, v.gear_offset - 2]|min, v.step_mm]|max} SPEED={[v.speed, 60]|min}
            _LOADER_REFINE MEASURE=1
            {% if params.HOLD|default(0)|int == 0 %}
                LOADER_RELEASE
                MANUAL_STEPPER STEPPER=loader ENABLE=0
            {% endif %}
            _LOADER_SET_POS POS=sensor2
            _LOADER_END RESULT=ok DE="Sensor 2 erreicht" EN="Sensor 2 reached"
        {% endif %}
    {% endif %}

[gcode_macro LOADER_NUDGE]
description: Messen - schiebt DIST mm nach, Servo bleibt geklemmt und Stepper bestromt (Ende mit LOADER_STOP)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% if "DIST" not in params or printer["gcode_macro _LOADER_STATE"].clamped|int == 0 %}
        _LOADER_DENY DE="LOADER_NUDGE ist ein Messschritt nach Bis Sensor 2 (Servo geklemmt) und braucht DIST=" EN="LOADER_NUDGE is a measuring step after To sensor 2 (servo clamped) and needs DIST="
    {% endif %}
    _LOADER_CHECK_IDLE
    _LOADER_MOVE_REL DIST={params.DIST|float} SPEED={params.SPEED|default(v.slow_speed)|float}

[gcode_macro LOADER_EXTRUDE]
description: Messen - Extruder foerdert DIST mm (heizt auf TEMP=, ohne TEMP auf das aktuelle Ziel)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% if "DIST" not in params %}
        _LOADER_DENY DE="LOADER_EXTRUDE ist ein Messschritt und braucht DIST=" EN="LOADER_EXTRUDE is a measuring step and needs DIST="
    {% endif %}
    _LOADER_CHECK_IDLE
    {% if printer["gcode_macro _LOADER_STATE"].clamped|int == 1 %}
        LOADER_STOP
    {% endif %}
    M109 S{temp}
    SAVE_GCODE_STATE NAME=_LOADER
    M83
    _LOADER_E DIST={params.DIST|float} F={(params.SPEED|default(v.ext_speed)|float * 60)|int}
    M400
    RESTORE_GCODE_STATE NAME=_LOADER
