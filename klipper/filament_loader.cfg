# =====================================================================
# voron0-autoloader - Makros (Logik)
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Diese Datei wird vom Installer als Symlink ins Config-Verzeichnis gelegt
# und NICHT von Hand bearbeitet (Updates ueber den Moonraker Update-Manager).
# Hardware-Pins und alle Parameter stehen in filament_loader_settings.cfg
# (wird vom Installer erzeugt und nie ueberschrieben, editierbar in der
# Web-Oberflaeche).
#
# Meldungen: zweisprachig (variable_lang in _LOADER_VARS = "de" / "en")
# Reihenfolge der Inbetriebnahme: siehe README.md
# =====================================================================


# ---------------------------------------------------------------------
# Laufzeit-Status (fuer Web-Oberflaeche und KlipperScreen)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_STATE]
description: Laufzeitstatus des Loaders (nicht bearbeiten)
variable_state: "idle"       # idle | loading | unloading | testing | error
variable_op: ""              # load_cold | load | unload | bench
variable_result: ""          # "" | ok | error
variable_msg: ""             # letzte Meldung in der eingestellten Sprache
variable_clamped: 0          # 1 = Servo klemmt
variable_event: 0            # Zaehler - jede Aenderung = ein abgeschlossener Vorgang
variable_fed: 0              # mm vom Loader bis Sensor 2 beim letzten Laden/Messen
gcode:


# ---------------------------------------------------------------------
# Meldungen
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SAY]
description: Meldung ausgeben (DE=, EN=, optional TYPE=error)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    RESPOND TYPE={params.TYPE|default("echo")} MSG="{m}"

[gcode_macro _LOADER_BEGIN]
description: Vorgang beginnen (OP=, STATE=)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=op VALUE='"{params.OP}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"{params.STATE}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=result VALUE='""'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=msg VALUE='""'

[gcode_macro _LOADER_END]
description: Vorgang beenden (RESULT=ok/error, DE=, EN=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_STATE"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=state VALUE='"{"idle" if params.RESULT == "ok" else "error"}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=result VALUE='"{params.RESULT}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=msg VALUE='"{m}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=event VALUE={s.event + 1}


# ---------------------------------------------------------------------
# Servo / Stepper Grundfunktionen
# ---------------------------------------------------------------------
[gcode_macro LOADER_CLAMP]
description: Servo drueckt den Hebel -> BMG-Zahnraeder greifen (optional ANGLE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set a = params.ANGLE|default(v.servo_clamp)|float %}
    SET_SERVO SERVO=loader_clamp ANGLE={a}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=clamped VALUE=1
    G4 P{(v.servo_settle * 1000)|int}

[gcode_macro LOADER_RELEASE]
description: Hebel frei -> Filament laeuft frei (optional ANGLE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set a = params.ANGLE|default(v.servo_release)|float %}
    SET_SERVO SERVO=loader_clamp ANGLE={a}
    SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=clamped VALUE=0
    G4 P{(v.servo_settle * 1000)|int}
    {% if v.servo_off_released|int == 1 %}
        SET_SERVO SERVO=loader_clamp WIDTH=0
    {% endif %}

[gcode_macro _LOADER_MOVE_REL]
description: Interner relativer Stepper-Move (DIST in mm, SPEED in mm/s)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set spd = params.SPEED|default(v.speed)|float %}
    MANUAL_STEPPER STEPPER=loader ENABLE=1 SET_POSITION=0 MOVE={params.DIST|float} SPEED={spd}
    M400

[gcode_macro _LOADER_E]
description: Extruder-Move (relativ, M83 vorher setzen) in Stuecken unter max_extrude_only_distance (Standard 50 mm)
gcode:
    {% set d = params.DIST|float %}
    {% set n = ((d|abs) / 40)|round(0, 'ceil')|int %}
    {% for i in range(n) %}
        G1 E{d / n} F{params.F|int}
    {% endfor %}

[gcode_macro LOADER_MOVE]
description: Test: DIST=mm (negativ=zurueck) SPEED=mm/s CLAMP=1/0
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set clamp = params.CLAMP|default(1)|int %}
    {% if clamp == 1 %}
        LOADER_CLAMP
    {% endif %}
    _LOADER_MOVE_REL DIST={params.DIST|default(100)|float} SPEED={params.SPEED|default(v.speed)|float}
    {% if clamp == 1 %}
        LOADER_RELEASE
    {% endif %}
    MANUAL_STEPPER STEPPER=loader ENABLE=0

[gcode_macro LOADER_STOP]
description: Servo loesen und Stepper stromlos schalten
gcode:
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0

[gcode_macro LOADER_AUTO]
description: Auto-Trigger am Loader-Eingang ein/aus (ENABLE=1/0, bis zum Neustart)
gcode:
    SET_FILAMENT_SENSOR SENSOR=loader_in ENABLE={params.ENABLE|default(1)|int}

[gcode_macro LOADER_BENCH]
description: Bench-Modus ein/aus (VALUE=1/0, bis zum Neustart; dauerhaft in den Einstellungen)
gcode:
    SET_GCODE_VARIABLE MACRO=_LOADER_VARS VARIABLE=bench_mode VALUE={params.VALUE|default(1)|int}

[gcode_macro LOADER_STATUS]
description: Sensor- und Loader-Status anzeigen
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set de = v.lang != "en" %}
    {% set a = ("Filament" if de else "filament") if printer["filament_switch_sensor loader_in"].filament_detected else ("leer" if de else "empty") %}
    {% if "filament_switch_sensor toolhead_in" in printer %}
        {% set b = ("Filament" if de else "filament") if printer["filament_switch_sensor toolhead_in"].filament_detected else ("leer" if de else "empty") %}
    {% else %}
        {% set b = "nicht konfiguriert" if de else "not configured" %}
    {% endif %}
    {% if de %}
        RESPOND MSG="Loader-Eingang: {a} / Toolhead-Eingang: {b} / Bench-Modus: {'an' if v.bench_mode|int == 1 else 'aus'}"
    {% else %}
        RESPOND MSG="Loader entrance: {a} / toolhead entrance: {b} / bench mode: {'on' if v.bench_mode|int == 1 else 'off'}"
    {% endif %}

[gcode_macro LOADER_BENCHTEST]
description: Bench-Test - Servo klemmt, Stepper faehrt DIST mm, Servo loest (braucht nur Sensor 1)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set dist = params.DIST|default(v.bench_dist)|float %}
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=bench STATE=testing
    {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_FAIL DE="Benchtest - kein Filament an Sensor 1" EN="Bench test - no filament at sensor 1"
    {% else %}
        LOADER_CLAMP
        _LOADER_MOVE_REL DIST={dist} SPEED={v.slow_speed}
        LOADER_RELEASE
        MANUAL_STEPPER STEPPER=loader ENABLE=0
        _LOADER_END RESULT=ok DE="Benchtest fertig" EN="Bench test done"
        _LOADER_SAY DE="Benchtest fertig" EN="Bench test done"
    {% endif %}


# ---------------------------------------------------------------------
# Fehlerbehandlung
# (action_raise_error wird beim Rendern ausgefuehrt -> darum eigenes Macro,
#  damit Servo-Loesen und Meldung vorher laufen)
# ---------------------------------------------------------------------
[gcode_macro _LOADER_RAISE]
gcode:
    {action_raise_error("AutoLoader: " ~ params.MSG)}

[gcode_macro _LOADER_FAIL]
description: Servo loesen, Stepper aus, Fehlermeldung, Abbruch (DE=, EN=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set m = params.EN if v.lang == "en" else params.DE %}
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0
    _LOADER_END RESULT=error DE="{params.DE}" EN="{params.EN}"
    RESPOND TYPE=error MSG="AutoLoader: {m}"
    _LOADER_RAISE MSG="{m}"

[gcode_macro _LOADER_CHECK_IDLE]
description: Abbruch waehrend eines Drucks (ALLOW=1 nur fuer die PRINT_START/PRINT_END-Hooks)
gcode:
    {% if printer.print_stats.state == "printing" and params.ALLOW|default(0)|int == 0 %}
        _LOADER_FAIL DE="Nicht waehrend eines Drucks moeglich" EN="Not possible while printing"
    {% endif %}

[gcode_macro _LOADER_RUNOUT]
description: runout_gcode von Sensor 1
gcode:
    _LOADER_SAY TYPE=error DE="AutoLoader - Filament am Loader-Eingang fehlt" EN="AutoLoader - filament missing at the loader entrance"


# ---------------------------------------------------------------------
# Sensorsuche
# Klipper verbietet, dass ein Makro sich selbst aufruft. Darum rendert
# _LOADER_SEARCH viele Aufrufe von _LOADER_SEARCH_STEP NACHEINANDER (nicht
# verschachtelt). Jeder Schritt wird erst bei seiner Ausfuehrung gerendert und
# liest den Sensor deshalb frisch; nach dem Treffer tun die restlichen nichts.
#   MODE=load   foerdern, bis Sensor 2 Filament meldet
#   MODE=unload zurueckziehen, bis Sensor 2 frei ist
#   WIN=  mm Suchfenster, BASE= mm schon gefahren (fuer "fed"), MEASURE=1 Messfahrt
# ---------------------------------------------------------------------
[gcode_macro _LOADER_SEARCH_STATE]
variable_mode: "load"
variable_done: 0             # 0 = sucht, 1 = gefunden, 2 = Fenster ausgeschoepft
variable_moved: 0.0
variable_steps: 0
variable_base: 0.0
variable_measure: 0
gcode:

[gcode_macro _LOADER_SEARCH]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set win = params.WIN|float %}
    {% set n = (win / v.step_mm)|round(0, 'ceil')|int %}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=mode VALUE='"{params.MODE|default("load")}"'
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=moved VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=steps VALUE=0
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=base VALUE={params.BASE|default(0)|float}
    SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=measure VALUE={params.MEASURE|default(0)|int}
    {% for i in range(n + 1) %}
        _LOADER_SEARCH_STEP WIN={win}
    {% endfor %}
    _LOADER_SEARCH_DONE

[gcode_macro _LOADER_SEARCH_STEP]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set s = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    {% set th = printer["filament_switch_sensor toolhead_in"].filament_detected %}
    {% set load = s.mode == "load" %}
    {% set win = params.WIN|float %}
    {% if s.done == 0 %}
        {% if (load and th) or (not load and not th) %}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=1
        {% elif s.moved >= win %}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=done VALUE=2
        {% elif load and not printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_FAIL DE="Filament am Loader-Eingang verschwunden" EN="Filament vanished at the loader entrance"
        {% else %}
            {% set d = [v.step_mm, win - s.moved]|min %}
            _LOADER_MOVE_REL DIST={d if load else -d} SPEED={v.slow_speed}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=moved VALUE={s.moved + d}
            SET_GCODE_VARIABLE MACRO=_LOADER_SEARCH_STATE VARIABLE=steps VALUE={s.steps + 1}
        {% endif %}
    {% endif %}

[gcode_macro _LOADER_SEARCH_DONE]
gcode:
    {% set s = printer["gcode_macro _LOADER_SEARCH_STATE"] %}
    {% set fed = s.base + s.moved %}
    {% if s.done != 1 %}
        {% if s.mode == "load" %}
            _LOADER_FAIL DE="Timeout - Filament hat Sensor 2 nicht erreicht (nach {fed|round(1)} mm)" EN="Timeout - filament did not reach sensor 2 (after {fed|round(1)} mm)"
        {% else %}
            _LOADER_FAIL DE="Timeout - Sensor 2 wird nicht frei" EN="Timeout - sensor 2 does not clear"
        {% endif %}
    {% elif s.mode == "load" %}
        SET_GCODE_VARIABLE MACRO=_LOADER_STATE VARIABLE=fed VALUE={fed}
        {% if s.base > 0 and s.steps == 0 %}
            {% if s.measure == 1 %}
                _LOADER_SAY TYPE=error DE="Achtung - Sensor 2 schon waehrend der vollen Fahrt erreicht, Messwert zu gross. tube_len kleiner einstellen und wiederholen" EN="Warning - sensor 2 was already reached during the full-speed move, the value is too large. Reduce tube_len and repeat"
            {% else %}
                _LOADER_FAIL DE="Sensor 2 schon waehrend der vollen Fahrt erreicht - tube_len ist zu gross oder approach zu klein. Filament zurueckziehen und tube_len messen" EN="Sensor 2 was already reached during the full-speed move - tube_len is too large or approach too small. Pull the filament back and measure tube_len"
            {% endif %}
        {% endif %}
        _LOADER_SAY DE="Loader - Sensor 2 nach {fed|round(1)} mm erreicht" EN="Loader - sensor 2 reached after {fed|round(1)} mm"
    {% else %}
        _LOADER_SAY DE="Loader - Sensor 2 frei" EN="Loader - sensor 2 clear"
    {% endif %}


# ---------------------------------------------------------------------
# Laden: volle Fahrt (speed) bis "approach" mm vor Sensor 2, dann Sensorsuche
# ---------------------------------------------------------------------
[gcode_macro _LOADER_NEED_TOOLHEAD_SENSOR]
gcode:
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_FAIL DE="Sensor 2 (toolhead_in) ist nicht konfiguriert - in den Einstellungen aktivieren" EN="Sensor 2 (toolhead_in) is not configured - enable it in the settings"
    {% endif %}

[gcode_macro _LOADER_LOAD_TO_GEARS]
description: Loader foerdert Filament bis in die Extruder-Zahnraeder, dann Servo frei
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
        _LOADER_FAIL DE="Kein Filament am Loader-Eingang" EN="No filament at the loader entrance"
    {% endif %}
    {% if printer["filament_switch_sensor toolhead_in"].filament_detected %}
        _LOADER_FAIL DE="Toolhead-Sensor meldet bereits Filament - erst entladen" EN="Toolhead sensor already reports filament - unload first"
    {% endif %}
    {% set approach = v.approach|default(30)|float %}
    {% set coarse = [v.tube_len - approach, 0]|max %}
    LOADER_CLAMP
    {% if coarse > 0 %}
        _LOADER_MOVE_REL DIST={coarse} SPEED={v.speed}
    {% endif %}
    _LOADER_SEARCH MODE=load WIN={approach + v.overrun} BASE={coarse}
    _LOADER_MOVE_REL DIST={v.gear_offset + v.gear_push} SPEED={v.slow_speed}
    LOADER_RELEASE
    MANUAL_STEPPER STEPPER=loader ENABLE=0

[gcode_macro FILAMENT_LOAD_COLD]
description: Filament bis in die Extruder-Zahnraeder foerdern (Hotend darf kalt sein)
gcode:
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=load_cold STATE=loading
    _LOADER_NEED_TOOLHEAD_SENSOR
    _LOADER_LOAD_TO_GEARS
    _LOADER_END RESULT=ok DE="Filament sitzt im Extruder" EN="Filament is seated in the extruder"
    _LOADER_SAY DE="Loader - Filament sitzt im Extruder. Weiter mit FILAMENT_LOAD TEMP=xxx" EN="Loader - filament is seated in the extruder. Continue with FILAMENT_LOAD TEMP=xxx"

[gcode_macro FILAMENT_LOAD]
description: Filament laden und bis in die Duese foerdern (TEMP=, PURGE=)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set temp = params.TEMP|default(v.default_temp)|float %}
    {% set purge = params.PURGE|default(v.purge_len)|float %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=load STATE=loading
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_NEED_TOOLHEAD_SENSOR
    {% else %}
        M104 S{temp}
        {% if not printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_LOAD_TO_GEARS
        {% endif %}
        M109 S{temp}
        SAVE_GCODE_STATE NAME=_LOADER
        M83
        _LOADER_E DIST={v.ext_to_nozzle} F={(v.ext_speed * 60)|int}
        {% if purge > 0 %}
            _LOADER_E DIST={purge} F={(v.purge_speed * 60)|int}
        {% endif %}
        M400
        RESTORE_GCODE_STATE NAME=_LOADER
        _LOADER_END RESULT=ok DE="Filament geladen" EN="Filament loaded"
        _LOADER_SAY DE="Loader - Filament geladen" EN="Loader - filament loaded"
    {% endif %}

[gcode_macro FILAMENT_LOADER_AUTO]
description: Wird von Sensor 1 ausgeloest (insert_gcode)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    G4 P{(v.auto_delay * 1000)|int}
    {% if v.bench_mode|int == 1 %}
        LOADER_BENCHTEST
    {% else %}
        FILAMENT_LOAD_COLD
    {% endif %}


# ---------------------------------------------------------------------
# Tip-Forming (Ablauf wie ERCF / Happy Hare / PrusaSlicer-Wipe-Tower)
# 1. optional rammen (tip_ram_len)
# 2. schnell aus der Schmelzzone reissen, dann langsamer bis in die
#    Kuehlzone (tip_cool_pos mm oberhalb der Duese)
# 3. optional Temperatur senken (tip_temp, ohne Warten)
# 4. tip_cool_moves Kuehlbewegungen um tip_cool_len, Tempo steigt von
#    tip_cool_start auf tip_cool_end -> duenne, feste Spitze ohne Faden
# Danach steht die Spitze ca. tip_cool_pos mm ueber der Duese.
# ---------------------------------------------------------------------
[gcode_macro _LOADER_FORM_TIP]
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set ram = v.tip_ram_len|default(0)|float %}
    {% set ttemp = v.tip_temp|default(0)|float %}
    {% set s0 = v.tip_speed_start|default(80)|float %}
    {% set s1 = v.tip_speed|default(18)|float %}
    {% set pos = v.tip_cool_pos|default(35)|float %}
    {% set clen = v.tip_cool_len|default(10)|float %}
    {% set moves = v.tip_cool_moves|default(4)|int %}
    {% set c0 = v.tip_cool_start|default(10)|float %}
    {% set c1 = v.tip_cool_end|default(50)|float %}
    {% set first = [15, pos]|min %}
    {% set rest = pos - first %}
    {% set inc = (c1 - c0) / ([2 * moves - 1, 1]|max) %}
    SAVE_GCODE_STATE NAME=_LOADER_TIP
    M83
    {% if ram > 0 %}
        G1 E{ram} F{(v.ext_speed * 60)|int}
    {% endif %}
    G1 E-{first} F{(s0 * 60)|int}
    {% if rest > 0 %}
        G1 E-{rest * 0.7} F{(s1 * 60)|int}
        G1 E-{rest * 0.2} F{(s1 * 30)|int}
        G1 E-{rest * 0.1} F{(s1 * 18)|int}
    {% endif %}
    {% if ttemp > 0 %}
        M104 S{ttemp}
    {% endif %}
    {% for i in range(moves) %}
        {% set sp = c0 + inc * i * 2 %}
        G1 E{clen} F{(sp * 60)|int}
        G1 E-{clen} F{((sp + inc) * 60)|int}
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=_LOADER_TIP

[gcode_macro LOADER_FORM_TIP]
description: Nur Spitze formen (TEMP=), Filament bleibt im Extruder - zum Einstellen der Tip-Parameter
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    _LOADER_CHECK_IDLE
    M109 S{temp}
    _LOADER_FORM_TIP
    _LOADER_SAY DE="Spitze geformt - mit FILAMENT_UNLOAD entladen oder von Hand ziehen und pruefen" EN="Tip formed - unload with FILAMENT_UNLOAD or pull by hand and inspect"


# ---------------------------------------------------------------------
# Entladen
# 1. Spitze formen (tip_enable), Servo ist dabei frei
# 2. Extruder zieht bis unload_ext_len (gesamt ab Duese) zurueck
# 3. Loader klemmt, Extruder-Stepper wird stromlos
# 4. Loader zieht, bis Sensor 2 frei ist, dann tube_len - unload_hold
# ---------------------------------------------------------------------
[gcode_macro FILAMENT_UNLOAD]
description: Filament entladen mit Tip-Forming (TEMP=) - Hotend wird aufgeheizt
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set temp = params.TEMP|default(v.default_temp)|float %}
    {% set tip = v.tip_enable|default(1)|int == 1 %}
    {% set done = v.tip_cool_pos|default(35)|float if tip else 0 %}
    {% set eject = v.tip_eject_speed|default(25)|float if tip else v.ext_speed %}
    _LOADER_CHECK_IDLE ALLOW={params.PRINT|default(0)|int}
    _LOADER_BEGIN OP=unload STATE=unloading
    {% if "filament_switch_sensor toolhead_in" not in printer %}
        _LOADER_NEED_TOOLHEAD_SENSOR
    {% else %}
        LOADER_RELEASE
        M109 S{temp}
        {% if tip %}
            _LOADER_FORM_TIP
        {% endif %}
        SAVE_GCODE_STATE NAME=_LOADER
        M83
        {% if v.unload_ext_len > done %}
            _LOADER_E DIST=-{v.unload_ext_len - done} F={(eject * 60)|int}
        {% endif %}
        M400
        RESTORE_GCODE_STATE NAME=_LOADER
        LOADER_CLAMP
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
        _LOADER_SEARCH MODE=unload WIN={[v.gear_offset + v.ext_to_nozzle - v.unload_ext_len, 0]|max + 30}
        _LOADER_MOVE_REL DIST=-{v.tube_len - v.unload_hold} SPEED={v.speed}
        LOADER_RELEASE
        MANUAL_STEPPER STEPPER=loader ENABLE=0
        _LOADER_END RESULT=ok DE="Entladen fertig" EN="Unload done"
        _LOADER_SAY DE="Loader - Entladen fertig, Filament kann von Hand entnommen werden" EN="Loader - unload done, the filament can be removed by hand"
    {% endif %}


# ---------------------------------------------------------------------
# Mainsail / KlipperScreen: deren Lade-Buttons rufen LOAD_FILAMENT und
# UNLOAD_FILAMENT auf. Temperatur: TEMP=, sonst aktuelles Ziel, sonst default_temp.
# ---------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Filament laden (AutoLoader) - TEMP=, PURGE=
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set purge = params.PURGE|default(v.purge_len)|float %}
    FILAMENT_LOAD TEMP={temp} PURGE={purge}

[gcode_macro UNLOAD_FILAMENT]
description: Filament entladen mit Tip-Forming (AutoLoader) - TEMP=
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    FILAMENT_UNLOAD TEMP={temp}


# ---------------------------------------------------------------------
# Druck-Hooks (vom Installer in PRINT_START / PRINT_END eingefuegt)
# ---------------------------------------------------------------------
[gcode_macro LOADER_PRINT_START]
description: In PRINT_START nach dem Aufheizen der Duese - prueft Sensor 2, laedt bei Bedarf (print_start_mode)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set mode = v.print_start_mode|default(2)|int %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    {% set has_tool = "filament_switch_sensor toolhead_in" in printer %}
    {% if mode > 0 and has_tool and not printer["filament_switch_sensor toolhead_in"].filament_detected %}
        {% if mode == 2 and printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_SAY DE="Druckstart - kein Filament im Toolhead, AutoLoader laedt" EN="Print start - no filament in the toolhead, AutoLoader is loading"
            FILAMENT_LOAD TEMP={temp} PURGE=0 PRINT=1
        {% else %}
            _LOADER_FAIL DE="Druckstart abgebrochen - kein Filament im Toolhead" EN="Print start aborted - no filament in the toolhead"
        {% endif %}
    {% endif %}

[gcode_macro LOADER_PRINT_END]
description: In PRINT_END vor TURN_OFF_HEATERS - entlaedt, wenn unload_after_print = 1
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% if v.unload_after_print|default(0)|int == 1 and "filament_switch_sensor toolhead_in" in printer %}
        {% if printer["filament_switch_sensor toolhead_in"].filament_detected %}
            FILAMENT_UNLOAD TEMP={tgt if tgt > 0 else v.default_temp} PRINT=1
        {% endif %}
    {% endif %}


# ---------------------------------------------------------------------
# Messhelfer (Web-Oberflaeche: Stepper kalibrieren -> Laengen messen)
# ---------------------------------------------------------------------
[gcode_macro LOADER_TO_SENSOR]
description: Messen - foerdert bis Sensor 2 und stoppt dort (Weg -> tube_len). COARSE= mm volle Fahrt, MAX= mm hoechstens
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set approach = v.approach|default(30)|float %}
    {% set coarse = params.COARSE|default([v.tube_len - approach - 30, 0]|max)|float %}
    {% set maxlen = params.MAX|default(v.tube_len + v.overrun + 40)|float %}
    {% set window = [maxlen - coarse, 2 * v.step_mm]|max %}
    _LOADER_CHECK_IDLE
    _LOADER_BEGIN OP=measure STATE=loading
    _LOADER_NEED_TOOLHEAD_SENSOR
    {% if "filament_switch_sensor toolhead_in" in printer %}
        {% if not printer["filament_switch_sensor loader_in"].filament_detected %}
            _LOADER_FAIL DE="Kein Filament am Loader-Eingang" EN="No filament at the loader entrance"
        {% elif printer["filament_switch_sensor toolhead_in"].filament_detected %}
            _LOADER_FAIL DE="Sensor 2 meldet bereits Filament - erst zurueckziehen" EN="Sensor 2 already reports filament - pull back first"
        {% else %}
            LOADER_CLAMP
            {% if coarse > 0 %}
                _LOADER_MOVE_REL DIST={coarse} SPEED={v.speed}
            {% endif %}
            _LOADER_SEARCH MODE=load WIN={window} BASE={coarse} MEASURE=1
            LOADER_RELEASE
            MANUAL_STEPPER STEPPER=loader ENABLE=0
            _LOADER_END RESULT=ok DE="Sensor 2 erreicht" EN="Sensor 2 reached"
        {% endif %}
    {% endif %}

[gcode_macro LOADER_EXTRUDE]
description: Messen - Extruder foerdert DIST mm (heizt auf TEMP=, ohne TEMP auf das aktuelle Ziel)
gcode:
    {% set v = printer["gcode_macro _LOADER_VARS"] %}
    {% set tgt = printer.extruder.target %}
    {% set temp = params.TEMP|default(tgt if tgt > 0 else v.default_temp)|float %}
    _LOADER_CHECK_IDLE
    M109 S{temp}
    SAVE_GCODE_STATE NAME=_LOADER
    M83
    _LOADER_E DIST={params.DIST|default(5)|float} F={(params.SPEED|default(v.ext_speed)|float * 60)|int}
    M400
    RESTORE_GCODE_STATE NAME=_LOADER
