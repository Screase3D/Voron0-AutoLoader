# voron0-autoloader – KlipperScreen menu (English)
# SPDX-License-Identifier: GPL-3.0-or-later
# Included from KlipperScreen.conf by install.sh – removed again by uninstall.sh.

[menu __main more autoloader]
name: AutoLoader
icon: filament
enable: {{ 'FILAMENT_LOAD_COLD' in printer.gcode_macros.list }}

[menu __main more autoloader status]
name: Loader status
icon: info
method: printer.gcode.script
params: {"script": "LOADER_STATUS"}

[menu __main more autoloader prepare]
name: Prepare
icon: arrow-down
method: printer.gcode.script
params: {"script": "FILAMENT_PREPARE"}

[menu __main more autoloader cold]
name: Load
icon: extrude
method: printer.gcode.script
params: {"script": "FILAMENT_LOAD_COLD"}

[menu __main more autoloader load]
name: Load hot
icon: filament
method: printer.gcode.script
params: {"script": "FILAMENT_LOAD"}
confirm: Heat the hotend, load the filament and feed it to the nozzle?

[menu __main more autoloader park]
name: Park
icon: retract
method: printer.gcode.script
params: {"script": "FILAMENT_PARK"}
confirm: Park the filament in the tube? The nozzle only heats if the filament is in it.

[menu __main more autoloader unload]
name: Unload
icon: retract
method: printer.gcode.script
params: {"script": "FILAMENT_UNLOAD"}
confirm: Unload the filament? The nozzle only heats if the filament is in it.

[menu __main more autoloader clamp]
name: Clamp
icon: complete
method: printer.gcode.script
params: {"script": "LOADER_CLAMP"}

[menu __main more autoloader release]
name: Release
icon: refresh
method: printer.gcode.script
params: {"script": "LOADER_RELEASE"}

[menu __main more autoloader ack]
name: Acknowledge error
icon: complete
method: printer.gcode.script
params: {"script": "LOADER_ACK"}

[menu __main more autoloader stop]
name: Stop / release
icon: stop
method: printer.gcode.script
params: {"script": "LOADER_STOP"}

[menu __main more autoloader bench]
name: Bench test
icon: settings
method: printer.gcode.script
params: {"script": "LOADER_BENCHTEST"}

[menu __main more autoloader tip]
name: Form tip
icon: heat-up
method: printer.gcode.script
params: {"script": "LOADER_FORM_TIP"}
confirm: Heat the hotend and only form the tip?
