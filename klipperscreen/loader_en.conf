# voronv0-filament-loader – KlipperScreen menu (English)
# SPDX-License-Identifier: GPL-3.0-or-later
# Included from KlipperScreen.conf by install.sh – removed again by uninstall.sh.

[menu __main more loader]
name: Loader
icon: filament
enable: {{ 'FILAMENT_LOAD_COLD' in printer.gcode_macros.list }}

[menu __main more loader status]
name: Loader status
icon: info
method: printer.gcode.script
params: {"script": "LOADER_STATUS"}

[menu __main more loader cold]
name: Load (cold)
icon: extrude
method: printer.gcode.script
params: {"script": "FILAMENT_LOAD_COLD"}

[menu __main more loader load]
name: Load (hot)
icon: filament
method: printer.gcode.script
params: {"script": "FILAMENT_LOAD"}
confirm: Heat the hotend, load the filament and feed it to the nozzle?

[menu __main more loader unload]
name: Unload
icon: retract
method: printer.gcode.script
params: {"script": "FILAMENT_UNLOAD"}
confirm: Heat the hotend and unload the filament?

[menu __main more loader clamp]
name: Clamp
icon: complete
method: printer.gcode.script
params: {"script": "LOADER_CLAMP"}

[menu __main more loader release]
name: Release
icon: refresh
method: printer.gcode.script
params: {"script": "LOADER_RELEASE"}

[menu __main more loader stop]
name: Stop / release
icon: stop
method: printer.gcode.script
params: {"script": "LOADER_STOP"}

[menu __main more loader bench]
name: Bench test
icon: settings
method: printer.gcode.script
params: {"script": "LOADER_BENCHTEST"}
